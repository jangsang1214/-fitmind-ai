name: Apply exact GARANG PNG logo

on:
  push:
    branches:
      - brand/exact-png-logo

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout logo patch branch
        uses: actions/checkout@v4
        with:
          ref: brand/exact-png-logo
          path: patch

      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          path: target
          fetch-depth: 0

      - name: Verify baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C target rev-parse HEAD)" = "55966ddf91e7b0916f3d8e2809396f15bf3a7f79"

      - name: Prepare image tooling
        run: python -m pip install --disable-pip-version-check pillow

      - name: Apply user-approved PNG logo
        shell: bash
        run: |
          set -euo pipefail
          python patch/scripts/apply_exact_garang_png_logo.py \
            patch/05_assets/garang-logo-exact.png.b64.txt \
            target

      - name: Run regression tests
        working-directory: target
        run: npm test

      - name: Validate build
        working-directory: target
        run: npm run build

      - name: Commit to main
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Replace GARANG app and Coach logo with exact PNG"
          git push origin HEAD:main

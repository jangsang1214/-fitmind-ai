name: Agent Migrate Demo Fixtures
on:
  push:
    branches:
      - agent/coach-multimodal-hardening-2026-09-16
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/coach-multimodal-hardening-2026-09-16
      - name: Migrate browser fixtures
        run: python scripts/migrate-browser-demo-fixtures.py
      - name: Verify fixture contract
        run: |
          git diff --check
          node tests/no-demo-entry.test.cjs
          if grep -R "localStorage.setItem('garang_demo'" tests/browser-*.cjs; then
            echo 'legacy browser demo auth fixture remains'
            exit 1
          fi
      - name: Commit migrated tests
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests
          git diff --cached --quiet && exit 0
          git commit -m "Migrate WebKit tests to authenticated fixtures"
          git push origin HEAD:agent/coach-multimodal-hardening-2026-09-16

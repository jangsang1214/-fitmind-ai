name: Agent Scan Demo Fixtures
on:
  push:
    branches:
      - agent/coach-multimodal-hardening-2026-09-16
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/coach-multimodal-hardening-2026-09-16
      - name: Find legacy demo fixtures
        run: |
          echo '--- browser demo references with context ---'
          grep -Rn -B 3 -A 5 "garang_demo" tests/browser-*.cjs || true
          echo '--- non-browser references ---'
          grep -Rnl --exclude='no-demo-entry.test.cjs' "garang_demo" tests | grep -v '/browser-' || true

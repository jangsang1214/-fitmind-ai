name: Build Public Food Corpus

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: Existing non-main branch that will receive the regenerated corpus
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: food-corpus-build-v1-${{ inputs.target_branch }}
  cancel-in-progress: false

jobs:
  build:
    if: ${{ inputs.target_branch != 'main' && startsWith(inputs.target_branch, 'ai/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out approved non-main corpus branch
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target_branch }}
          fetch-depth: 0

      - name: Fail closed on main or unexpected branch
        shell: bash
        env:
          TARGET_BRANCH: ${{ inputs.target_branch }}
        run: |
          set -euo pipefail
          test "$TARGET_BRANCH" != main
          case "$TARGET_BRANCH" in ai/*) ;; *) echo 'Target must be an ai/* branch.' >&2; exit 42 ;; esac

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Download official USDA Foundation and FNDDS releases
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/garang-food/foundation" "$RUNNER_TEMP/garang-food/fndds"
          curl --fail --location --retry 3 --silent --show-error 'https://fdc.nal.usda.gov/fdc-datasets/FoodData_Central_foundation_food_json_2026-04-30.zip' --output "$RUNNER_TEMP/garang-food/foundation.zip"
          curl --fail --location --retry 3 --silent --show-error 'https://fdc.nal.usda.gov/fdc-datasets/FoodData_Central_survey_food_json_2024-10-31.zip' --output "$RUNNER_TEMP/garang-food/fndds.zip"
          unzip -q "$RUNNER_TEMP/garang-food/foundation.zip" -d "$RUNNER_TEMP/garang-food/foundation"
          unzip -q "$RUNNER_TEMP/garang-food/fndds.zip" -d "$RUNNER_TEMP/garang-food/fndds"
          FOUNDATION_JSON="$(find "$RUNNER_TEMP/garang-food/foundation" -type f -name '*.json' | head -n 1)"
          FNDDS_JSON="$(find "$RUNNER_TEMP/garang-food/fndds" -type f -name '*.json' | head -n 1)"
          test -n "$FOUNDATION_JSON"
          test -n "$FNDDS_JSON"
          echo "FOUNDATION_JSON=$FOUNDATION_JSON" >> "$GITHUB_ENV"
          echo "FNDDS_JSON=$FNDDS_JSON" >> "$GITHUB_ENV"

      - name: Build compact verified supplemental corpus
        run: |
          node scripts/build-public-food-corpus.cjs --foundation "$FOUNDATION_JSON" --fndds "$FNDDS_JSON" --output 04_data/knowledge/food-db-supplemental-usda-v1.json --meta 04_data/knowledge/food-db-supplemental-usda-v1.meta.json

      - name: Verify generated corpus scale and provenance
        run: |
          node - <<'NODE'
          const corpus=require('./04_data/knowledge/food-db-supplemental-usda-v1.json');
          const meta=require('./04_data/knowledge/food-db-supplemental-usda-v1.meta.json');
          if(!Array.isArray(corpus.records)||corpus.records.length<4000)throw new Error('CORPUS_SCALE_GATE');
          if(corpus.records.some(row=>row.nutrition_status!=='verified'))throw new Error('NON_VERIFIED_ROW');
          if(corpus.records.some(row=>!row.provenance?.provider||!row.provenance?.dataset||!row.provenance?.recordId))throw new Error('MISSING_PROVENANCE');
          if(meta.audit?.pass!==true)throw new Error('AUDIT_NOT_GREEN');
          console.log(JSON.stringify({count:corpus.records.length,sourceCounts:meta.sourceCounts,dedupe:meta.dedupe,audit:meta.audit},null,2));
          NODE

      - name: Commit generated public corpus to target branch
        shell: bash
        env:
          TARGET_BRANCH: ${{ inputs.target_branch }}
        run: |
          set -euo pipefail
          git config user.name 'GARANG Food Data Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add 04_data/knowledge/food-db-supplemental-usda-v1.json 04_data/knowledge/food-db-supplemental-usda-v1.meta.json
          if git diff --cached --quiet; then echo 'No corpus changes.'; exit 0; fi
          git commit -m 'Regenerate USDA supplemental food corpus'
          git push origin "HEAD:${TARGET_BRANCH}"

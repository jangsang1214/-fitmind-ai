name: Measure Nutrition Identity Production

on:
  push:
    branches:
      - measure/nutrition-identity-real-usage-20260925
    paths:
      - .github/workflows/measure-nutrition-identity-production.yml
      - scripts/measure-production-nutrition-identity.cjs
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out measurement branch
        uses: actions/checkout@v7

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Select read-only Firebase admin credential
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT_FITFIND_AI: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FITFIND_AI }}
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
        run: |
          set -euo pipefail
          cred_file="$RUNNER_TEMP/firebase-measure-service-account.json"
          if [[ -n "${FIREBASE_SERVICE_ACCOUNT_FITFIND_AI:-}" ]]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_FITFIND_AI" > "$cred_file"
          elif [[ -n "${GOOGLE_APPLICATION_CREDENTIALS_JSON:-}" ]]; then
            printf '%s' "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > "$cred_file"
          else
            echo "::error::No Firebase Admin credential is configured for aggregate measurement."
            exit 5
          fi
          node -e "JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'))" "$cred_file"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$cred_file" >> "$GITHUB_ENV"
      - name: Install Firebase Admin runtime
        run: npm ci --prefix functions --omit=dev --no-audit --no-fund

      - name: Aggregate production Food Identity state
        id: measure
        shell: bash
        run: |
          set -euo pipefail
          cd functions
          node ../scripts/measure-production-nutrition-identity.cjs | tee "$RUNNER_TEMP/nutrition-identity-metrics.log"
          line="$(grep '^GARANG_NUTRITION_IDENTITY_METRICS=' "$RUNNER_TEMP/nutrition-identity-metrics.log" | tail -1)"
          test -n "$line" || { echo "::error::Aggregate metrics line missing"; exit 4; }
          json="${line#GARANG_NUTRITION_IDENTITY_METRICS=}"
          {
            echo '### GARANG Nutrition Identity production aggregate'
            echo
            echo 'Aggregate-only; no user IDs, GTINs, product names, or raw records are emitted.'
            echo
            echo '```json'
            echo "$json" | jq .
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

name: GARANG release gate
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: garang-release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify GARANG Intelligence Core v1 combined
        continue-on-error: true
        run: node tests/intelligence-core-v1.test.cjs
      - name: Combined score sentinel
        if: always()
        continue-on-error: true
        run: test ! -f .garang-intelligence-failure-score-contract
      - name: Combined missing-data sentinel
        if: always()
        continue-on-error: true
        run: test ! -f .garang-intelligence-failure-missing-data
      - name: Combined future-data sentinel
        if: always()
        continue-on-error: true
        run: test ! -f .garang-intelligence-failure-future-data
      - name: Combined pain sentinel
        if: always()
        continue-on-error: true
        run: test ! -f .garang-intelligence-failure-pain-guardrail
      - name: Combined completed-plan sentinel
        if: always()
        continue-on-error: true
        run: test ! -f .garang-intelligence-failure-completed-plan
      - name: Combined pipeline sentinel
        if: always()
        continue-on-error: true
        run: test ! -f .garang-intelligence-failure-pipeline
      - name: Combined compact sentinel
        if: always()
        continue-on-error: true
        run: test ! -f .garang-intelligence-failure-compact-context
      - name: Regression group A - core runtime
        if: always()
        continue-on-error: true
        run: node tests/core.test.cjs && node tests/schema-contract.test.cjs && node tests/schema-freeze-contract-v1.test.cjs && node tests/error-system-v1.test.cjs && node tests/adapters.test.cjs && node tests/commercial-core.test.cjs && node tests/stability-feature-preservation.test.cjs && node tests/runtime-lifecycle-contract.test.cjs && node tests/runtime-observer-inventory.test.cjs && node tests/runtime-freeze-contract-v1.test.cjs
      - name: Regression group B - agent storage auth
        if: always()
        continue-on-error: true
        run: node tests/agent-contract.test.cjs && node tests/agent-e2e.test.cjs && node tests/agent-account-pinning.test.cjs && node tests/sync-durability.test.cjs && node tests/state-sanitizer.test.cjs && node tests/history-persistence-v2.test.cjs && node tests/legacy-migration-v2.test.cjs && node tests/pwa-safety.test.cjs && node tests/version-ui-contract.test.cjs && node tests/auth-route-mobile.test.cjs
      - name: Regression group C - data memory decision
        if: always()
        continue-on-error: true
        run: node tests/data-actions-contract.test.cjs && node tests/data-recovery-v3.test.cjs && node tests/touch-state-recovery-contract.test.cjs && node tests/lifetime-history.test.cjs && node tests/post-login-app-boot.test.cjs && node tests/privacy-security.test.cjs && node tests/security-rules.test.cjs && node tests/memory-intelligence.test.cjs && node tests/memory-benchmark.test.cjs && node tests/state-intelligence.test.cjs && node tests/state-benchmark.test.cjs && node tests/decision-intelligence.test.cjs && node tests/decision-benchmark.test.cjs && node tests/decision-agent-e2e.test.cjs
      - name: Regression group D - intelligence UI smoke
        if: always()
        continue-on-error: true
        run: node tests/intelligence-core-v1.test.cjs && node tests/demo-feedback-regression.test.cjs && node tests/workout-intelligence-v1.test.cjs && node tests/collapsible-intelligence-ui.test.cjs && node tests/coach-profile-stability.test.cjs && node tests/coach-auth-stability.test.cjs && node tests/coach-decision-compact-ui.test.cjs && node tests/coach-top-sync-ux.test.cjs && node tests/app-e2e-smoke.test.cjs
      - name: Regression group E - backend functions
        if: always()
        continue-on-error: true
        run: node backend/tests/core.test.cjs && node backend/tests/intelligence-contract.test.cjs && node functions/tests/memory-engine.test.cjs && node functions/tests/agent-context.test.cjs && node functions/tests/account-security.test.cjs
      - name: Regression group F - final contracts
        if: always()
        continue-on-error: true
        run: node tests/today.test.cjs && node tests/major-update.test.cjs && node tests/i18n-structure.test.cjs && node tests/entity-i18n.test.cjs && node tests/units.test.cjs && node tests/screen-registry.test.cjs
      - name: Test Commercial Core and regressions
        if: always()
        run: npm test
      - name: Validate runtime and build
        run: npm run build
      - name: Verify build entry
        run: test -f dist/index.html && test -f dist/06_features/final/commercial-core.js && test -f dist/runtime-manifest.json
      - name: Verify live Firebase public health
        run: node tests/firebase-live-health.test.cjs
      - name: Install browser and rules test dependencies
        run: npm install --no-save --package-lock=false playwright@1.55.0 firebase@10.13.0 @firebase/rules-unit-testing@3.0.3 firebase-tools@13.35.1
      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: Verify Firestore rules in emulator
        run: npx firebase emulators:exec --only firestore --project garang-rules-test "node tests/firestore-rules-emulator.test.cjs"
      - name: Verify Firebase CDN fallback
        run: node tests/browser-firebase-fallback.test.cjs
      - name: Verify real browser interactions
        run: node tests/browser-interaction.test.cjs
      - name: Verify mobile layout boundary
        run: node tests/browser-mobile-layout-boundary.test.cjs
      - name: Verify authenticated app boot
        run: node tests/browser-authenticated-boot.test.cjs
      - name: Verify authenticated Coach plan flow
        run: node tests/browser-authenticated-coach-plan.test.cjs
      - name: Trace authenticated recovery mutation loop
        run: node tests/browser-recovery-mutation-diagnostic.cjs
      - name: Verify authenticated recovery touch
        run: node tests/browser-authenticated-recovery-touch.test.cjs
      - name: Verify WebKit mobile regression suite
        run: node tests/browser-webkit-regression.test.cjs
      - name: Verify WebKit Settings touch regression
        run: node tests/browser-settings-touch-regression.test.cjs
      - name: Verify mobile button health audit
        run: node tests/browser-mobile-button-audit.test.cjs
      - name: Verify mobile runtime stability stress
        run: node tests/browser-mobile-stability-stress.test.cjs
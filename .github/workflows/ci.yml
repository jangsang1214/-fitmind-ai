name: GARANG release gate
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: garang-release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    name: core-build-rules
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked CI dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify locked dependency contract
        run: |
          node - <<'NODE'
          const p=require('./package-lock.json');
          const d=p.packages?.['']?.devDependencies||{};
          const expected={
            playwright:'1.55.0',
            firebase:'10.13.0',
            'firebase-tools':'13.35.1',
            '@firebase/rules-unit-testing':'3.0.3'
          };
          for(const [k,v] of Object.entries(expected)){
            if(d[k]!==v)throw new Error(`${k} lock mismatch: ${d[k]}`);
          }
          if(p.lockfileVersion!==3)throw new Error(`expected lockfileVersion 3, got ${p.lockfileVersion}`);
          console.log('locked dependency contract: PASS');
          NODE
      - name: Verify browser test server portability
        run: node tests/browser-server-portability.test.cjs
      - name: Verify production dependency security
        run: timeout 90s npm audit --omit=dev --audit-level=high
      - name: Report dev tooling audit
        run: |
          set +e
          timeout 90s npm audit --audit-level=low --json > dev-audit.json
          audit_code=$?
          set -e
          node - <<'NODE'
          const fs=require('node:fs');
          try{
            const report=JSON.parse(fs.readFileSync('dev-audit.json','utf8'));
            const v=report.metadata?.vulnerabilities||{};
            console.log(`dev/tooling audit: total=${v.total??'n/a'} critical=${v.critical??'n/a'} high=${v.high??'n/a'} moderate=${v.moderate??'n/a'} low=${v.low??'n/a'}`);
          }catch{
            console.log('dev/tooling audit report unavailable; tooling audit remains non-blocking');
          }
          NODE
          echo "dev tooling audit exit code: ${audit_code} (informational only)"
      - name: Verify GARANG Intelligence Core v1
        run: node tests/intelligence-core-v1.test.cjs
      - name: Verify GARANG Action & Data Reliability v1
        run: node tests/agent-contract-v2.test.cjs && node tests/action-data-reliability-v1.test.cjs && node tests/action-data-bridge-v1.test.cjs
      - name: Test Commercial Core and regressions
        run: npm test
      - name: Validate runtime and build
        run: npm run build
      - name: Verify build entry
        run: test -f dist/index.html && test -f dist/06_features/final/commercial-core.js && test -f dist/runtime-manifest.json
      - name: Verify live Firebase public health
        run: node tests/firebase-live-health.test.cjs
      - name: Verify Firestore rules in emulator
        run: npx firebase emulators:exec --only firestore --project garang-rules-test "node tests/firestore-rules-emulator.test.cjs"

  browser:
    name: browser-webkit
    needs: core
    runs-on: ubuntu-latest
    timeout-minutes: 40
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-noble
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked CI dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build browser test bundle
        run: npm run build
      - name: Verify browser build entry
        run: test -f dist/index.html && test -f dist/06_features/final/commercial-core.js && test -f dist/runtime-manifest.json
      - name: Verify Firebase CDN fallback
        run: node tests/browser-firebase-fallback.test.cjs
      - name: Verify real browser interactions
        run: node tests/browser-interaction.test.cjs
      - name: Verify mobile layout boundary
        run: node tests/browser-mobile-layout-boundary.test.cjs
      - name: Verify Today action flow
        run: node tests/browser-today-action-flow.test.cjs
      - name: Verify Today visual parity
        run: node tests/browser-today-visual-parity.test.cjs
      - name: Verify daily GARANG plan draft
        run: node tests/browser-daily-plan-draft.test.cjs
      - name: Verify Simplified Shell WebKit
        run: node tests/browser-simplified-shell.test.cjs
      - name: Verify Planner WebKit plan execution
        run: node tests/browser-plan-execution.test.cjs
      - name: Verify Nutrition recommendation flow
        run: node tests/browser-nutrition-recommendation.test.cjs
      - name: Verify truth surface and first-record flow
        run: node tests/browser-truth-surface.test.cjs
      - name: Verify Golden Path integration
        run: node tests/browser-golden-path.test.cjs
      - name: Verify Golden Path complete journey
        run: node tests/browser-golden-path-complete.test.cjs
      - name: Verify authenticated app boot
        run: node tests/browser-authenticated-boot.test.cjs
      - name: Verify authenticated Coach plan flow
        run: node tests/browser-authenticated-coach-plan.test.cjs
      - name: Verify Coach conversational logging flow
        run: node tests/browser-conversational-intelligence.test.cjs
      - name: Trace authenticated recovery mutation loop
        run: node tests/browser-recovery-mutation-diagnostic.cjs
      - name: Verify authenticated recovery touch
        run: node tests/browser-authenticated-recovery-touch.test.cjs
      - name: Verify WebKit mobile regression suite
        run: node tests/browser-webkit-regression.test.cjs
      - name: Verify WebKit Settings touch regression
        run: node tests/browser-settings-touch-regression.test.cjs
      - name: Verify mobile button health audit
        run: node tests/browser-mobile-button-audit.test.cjs
      - name: Verify mobile runtime stability stress
        run: node tests/browser-mobile-stability-stress.test.cjs

  verify:
    name: verify
    if: always()
    needs: [core, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require all release jobs
        env:
          CORE_RESULT: ${{ needs.core.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: |
          echo "core=${CORE_RESULT} browser=${BROWSER_RESULT}"
          test "${CORE_RESULT}" = "success"
          test "${BROWSER_RESULT}" = "success"
          echo "GARANG release gate: PASS"
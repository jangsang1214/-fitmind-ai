name: Presentation v4 review screens
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: presentation-v4-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  screenshots:
    if: github.event.pull_request.head.ref == 'design/commercial-v4-clean-presentation'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-noble
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked CI dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build review bundle
        run: npm run build
      - name: Capture binding-board review states
        run: node tests/browser-presentation-v4-review-screenshots.cjs
      - name: Upload Presentation v4 review screens
        uses: actions/upload-artifact@v4
        with:
          name: presentation-v4-review-screens
          path: artifacts/presentation-v4-review/*.png
          if-no-files-found: error
          retention-days: 7

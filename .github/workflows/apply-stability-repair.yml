name: Apply GARANG stability repair

on:
  push:
    branches:
      - fix/stability-login-regressions

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@v4
        with:
          ref: fix/stability-login-regressions
          path: patch

      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          path: target
          fetch-depth: 0

      - name: Apply repair
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C target rev-parse HEAD)" = "af755dfba13bb8d98ed0392a4010879f97db1f98"
          cp patch/scripts/apply_stability_repair.py target/scripts/apply_stability_repair.py
          cp patch/scripts/fix_build_integrity.py target/scripts/fix_build_integrity.py
          cd target
          python scripts/apply_stability_repair.py
          python scripts/fix_build_integrity.py

      - name: Run tests
        working-directory: target
        run: npm test

      - name: Build
        working-directory: target
        run: npm run build

      - name: Commit to main
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js 01_app/app.js index.html garang-auth-bootstrap.js garang-font-logo-v1.css garang-stability-v1.css garang-app-icon.svg manifest.webmanifest sw.js runtime-manifest.json script_3.js
          git commit -m "Fix GARANG login, regressions, typography and app icon"
          git push origin HEAD:main

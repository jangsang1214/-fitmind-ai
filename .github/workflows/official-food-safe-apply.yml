name: Official food safe apply
on:
  pull_request:
    paths:
      - '04_data/knowledge/kfind-home-analyzed-v1.json'
      - '02_core/food-corpus-safe-overrides-v1.js'
      - 'scripts/apply-official-food-overrides.cjs'
      - 'tests/food-data-quality-gate.test.cjs'
      - '.github/workflows/official-food-safe-apply.yml'
permissions:
  contents: write
jobs:
  apply-safe-overrides:
    if: github.head_ref == 'agent/official-food-safe-overrides-v1-2026-09-15'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/official-food-safe-overrides-v1-2026-09-15
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore canonical food DB from PR base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git show "$BASE_SHA:04_data/knowledge/food-db.json" > 04_data/knowledge/food-db.json
      - name: Verify pre-apply quality gate
        run: node tests/food-data-quality-gate.test.cjs
      - name: Apply safe official overrides without rewriting untouched rows
        run: node scripts/apply-official-food-overrides.cjs --write
      - name: Verify post-apply quality gate
        run: node tests/food-data-quality-gate.test.cjs
      - name: Commit generated canonical food DB
        run: |
          if git diff --quiet -- 04_data/knowledge/food-db.json; then
            echo 'No canonical food changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 04_data/knowledge/food-db.json
          git commit -m 'Apply minimal provenance-safe K-FIND overrides'
          git push

name: GARANG Wanted derivative gate
on:
  push:
    branches:
      - 'wanted/**'
      - 'agent/wanted-*'
  pull_request:
    branches:
      - 'wanted/**'
permissions:
  contents: read
concurrency:
  group: garang-wanted-${{ github.ref }}
  cancel-in-progress: true
jobs:
  judge-mode:
    name: wanted-judge-mode-webkit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-noble
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify 14-day synthetic judging dataset
        run: node tests/wanted-14day-dataset.test.cjs
      - name: Verify deployment-origin compatibility
        run: node tests/wanted-deployment-origin.test.cjs
      - name: Build Wanted derivative
        run: npm run build
      - name: Verify derivative assets ship
        run: |
          test -f dist/06_features/ui/runtime/garang-wanted-submission-v1.js
          test -f dist/06_features/ui/runtime/garang-wanted-ux-fixes-v1.js
          test -f dist/03_styles/runtime/garang-wanted-submission-v1.css
          test -f dist/03_styles/runtime/garang-wanted-ux-fixes-v1.css
          test -f dist/04_data/wanted/wanted-14day-synthetic-v1.json
          grep -q 'GARANG_WANTED_SUBMISSION' dist/07_config/version.js
          grep -q 'GARANG_WANTED_ASSET_ROOT' dist/07_config/version.js
          grep -q 'garang-wanted-ux-fixes-v1' dist/07_config/version.js
          grep -q 'garang-wanted-judge-data-v1' dist/04_data/wanted/wanted-14day-synthetic-v1.json
      - name: Verify 60-second judging journey
        run: node tests/browser-wanted-submission.test.cjs
      - name: Verify judge UX affordances
        run: node tests/browser-wanted-ux-affordances.test.cjs

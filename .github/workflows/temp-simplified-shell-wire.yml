name: TEMP simplified shell wiring
on:
  push:
    branches: [feature/simplified-shell-v1]
    paths:
      - scripts/apply-simplified-shell-v1.cjs
      - .github/workflows/temp-simplified-shell-wire.yml
permissions:
  contents: write
jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/simplified-shell-v1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply exact wiring
        run: node scripts/apply-simplified-shell-v1.cjs
      - name: Commit wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html runtime-manifest.json package.json .github/workflows/ci.yml
          if git diff --cached --quiet; then
            echo "No wiring changes needed"
          else
            git commit -m "feat: wire simplified shell into runtime"
            git push origin HEAD:feature/simplified-shell-v1
          fi

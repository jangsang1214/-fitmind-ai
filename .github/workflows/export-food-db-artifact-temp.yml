name: Finalize official food corpus v3 temp

on:
  push:
    branches:
      - agent/official-food-corpus-v3-2026-09-16
    paths:
      - .github/workflows/export-food-db-artifact-temp.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/official-food-corpus-v3-2026-09-16
          fetch-depth: 0
      - name: Strengthen food quality gate for v3
        run: python scripts/finalize-official-food-v3-temp.py
      - name: Run food data gates
        run: |
          node tests/food-data-quality-gate.test.cjs
          node tests/food-corpus-multisource-match-v3.test.cjs
      - name: Remove temporary materialization helpers and commit
        run: |
          rm .github/workflows/export-food-db-artifact-temp.yml
          rm scripts/materialize-official-food-corpus-v3-temp.cjs
          rm scripts/finalize-official-food-v3-temp.py
          git config user.name "jangsang1214"
          git config user.email "jangsang051214@gmail.com"
          git add -A tests/food-data-quality-gate.test.cjs .github/workflows/export-food-db-artifact-temp.yml scripts/materialize-official-food-corpus-v3-temp.cjs scripts/finalize-official-food-v3-temp.py
          git commit -m "test: lock official food corpus v3 quality state"
          git push origin HEAD:agent/official-food-corpus-v3-2026-09-16

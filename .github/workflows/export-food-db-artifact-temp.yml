name: Materialize official food corpus v3 temp

on:
  push:
    branches:
      - agent/official-food-corpus-v3-2026-09-16
    paths:
      - .github/workflows/export-food-db-artifact-temp.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/official-food-corpus-v3-2026-09-16
          fetch-depth: 0
      - name: Materialize reviewed official mappings
        run: node scripts/materialize-official-food-corpus-v3-temp.cjs
      - name: Verify exact reviewed result
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const crypto=require('node:crypto');
          const assert=require('node:assert/strict');
          const foods=JSON.parse(fs.readFileSync('04_data/knowledge/food-db.json','utf8'));
          const audit=JSON.parse(fs.readFileSync('04_data/knowledge/official-food-corpus-v3.json','utf8'));
          const counts={verified:0,approximate:0,estimated:0,unknown:0};
          for(const row of foods)counts[row.nutrition_status||'unknown']=(counts[row.nutrition_status||'unknown']||0)+1;
          assert.equal(foods.length,500);
          assert.deepEqual(counts,{verified:232,approximate:3,estimated:265,unknown:0});
          assert.equal(audit.result.changedRows,151);
          assert.equal(audit.result.unchangedRows,349);
          assert.deepEqual(audit.result.sourceContribution,{KDDB_ANALYZED:86,KFCT_10_4:63,PFDB:2});
          assert.deepEqual(audit.result.remainingApproximate,['라면','오트밀','그릭요거트']);
          assert.equal(audit.result.identitySha256,'29cf92749dfc578d51bda4b17608f2edb52abb365a36879ea5af1b83a8225cce');
          assert.equal(audit.result.canonicalSha256,'e0b235a5f2d2e1d16288343f5110f71a9b2ffefa23aae2a463655d7dc9ae15f8');
          const ramen=foods.find(x=>x.name==='라면');
          assert.ok(ramen);
          assert.notEqual(ramen.nutrition_status,'verified');
          assert.equal(audit.records.length,151);
          console.log({counts,changed:audit.result.changedRows,sources:audit.result.sourceContribution});
          NODE
      - name: Verify matcher contract
        run: node tests/food-corpus-multisource-match-v3.test.cjs
      - name: Commit materialized corpus
        run: |
          git config user.name "jangsang1214"
          git config user.email "jangsang051214@gmail.com"
          git add 04_data/knowledge/food-db.json 04_data/knowledge/official-food-corpus-v3.json
          git diff --cached --exit-code && { echo 'Expected materialized changes were not produced'; exit 1; } || true
          git commit -m "data: apply reviewed official food corpus v3"
          git push origin HEAD:agent/official-food-corpus-v3-2026-09-16

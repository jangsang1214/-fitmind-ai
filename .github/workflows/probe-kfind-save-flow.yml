name: Probe K-FIND Save Flow

on:
  push:
    branches:
      - ai/korean-food-source-acquisition-v2-20260924
    paths:
      - .github/workflows/probe-kfind-save-flow.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Extract K-FIND save/download flow
        shell: bash
        run: |
          set -euo pipefail
          URL='https://various.foodsafetykorea.go.kr/nutrient/export/down/filePop.do?pagenum=1&totalListCnt=17&pageblock=10&pagesize=10&searchDbSeq=1787898710194&searchDbGubun=02&searchOpenApi=Y'
          curl --fail --location --retry 3 --silent --show-error "$URL" -o "$RUNNER_TEMP/kfind-popup.html"
          python - <<'PY'
          import json,re,os
          from pathlib import Path
          text=(Path(os.environ['RUNNER_TEMP'])/'kfind-popup.html').read_text(errors='ignore')
          keys=['fnSave','cudAction.do','ComFileDownDirect','vmFileKey','pageToken','searchDbSeq','searchDbGubun','agencyType','usePurpose']
          snippets={}
          for key in keys:
              items=[]
              for m in re.finditer(re.escape(key),text,re.I):
                  s=max(0,m.start()-1800); e=min(len(text),m.end()+2600)
                  part=re.sub(r'\r','',text[s:e])
                  if part not in items: items.append(part[:5000])
                  if len(items)>=6: break
              snippets[key]=items
          out={'observedAt':'2026-09-24','snippets':snippets}
          Path('04_data/knowledge/kfind-save-flow-probe-v1.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(out,ensure_ascii=False,indent=2)[:30000])
          PY
      - name: Commit flow probe
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'GARANG K-FIND Probe'
          git config user.email 'actions@users.noreply.github.com'
          git add 04_data/knowledge/kfind-save-flow-probe-v1.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record K-FIND save flow probe [skip kfind-probe]'
          git push origin "HEAD:${GITHUB_REF_NAME}"

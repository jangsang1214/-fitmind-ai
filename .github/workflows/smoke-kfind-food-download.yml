name: Smoke K-FIND Food Download

on:
  push:
    branches:
      - ai/korean-food-source-acquisition-v2-20260924
    paths:
      - .github/workflows/smoke-kfind-food-download.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Register declared usage and download latest K-FIND food DB
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://various.foodsafetykorea.go.kr'
          POP="$BASE/nutrient/export/down/filePop.do?pagenum=1&totalListCnt=17&pageblock=10&pagesize=10&searchDbSeq=1787898710194&searchDbGubun=02&searchOpenApi=Y"
          JAR="$RUNNER_TEMP/kfind.cookies"
          HTML="$RUNNER_TEMP/kfind-popup.html"
          curl --fail --location --retry 3 --silent --show-error -c "$JAR" -b "$JAR" "$POP" -o "$HTML"
          python - <<'PY' > "$RUNNER_TEMP/kfind.env"
          import re,html,os
          from pathlib import Path
          text=Path(os.environ['RUNNER_TEMP']+'/kfind-popup.html').read_text(errors='ignore')
          token=re.search(r'name="pageToken"[^>]*value="([^"]+)"',text)
          key=re.search(r'vmFileKey\s*:\s*"([^"]+)"',text)
          if not token or not key: raise SystemExit('K-FIND popup token/file key not found')
          print('PAGE_TOKEN='+token.group(1))
          print('FILE_KEY='+key.group(1))
          PY
          source "$RUNNER_TEMP/kfind.env"
          curl --fail --location --retry 3 --silent --show-error -c "$JAR" -b "$JAR" \
            -e "$POP" \
            --data-urlencode "pageToken=$PAGE_TOKEN" \
            --data-urlencode 'dbGubun=02' \
            --data-urlencode 'sosok=GARANG' \
            --data-urlencode 'depart=AI/Data' \
            --data-urlencode 'agencyType=01' \
            --data-urlencode 'usePurpose=02' \
            --data-urlencode 'remark=GARANG 앱 영양 데이터베이스 연동 및 품질 검증' \
            "$BASE/nutrient/export/down/cudAction.do" \
            -o "$RUNNER_TEMP/kfind-register-response.html"
          curl --fail --location --retry 3 --silent --show-error -c "$JAR" -b "$JAR" \
            -e "$POP" \
            -D "$RUNNER_TEMP/kfind-download.headers" \
            "$BASE/nutrient/multi/file/download.do?key=$(python -c 'import os,urllib.parse; print(urllib.parse.quote(os.environ["FILE_KEY"],safe=""))')" \
            -o "$RUNNER_TEMP/kfind-food.bin"
          file "$RUNNER_TEMP/kfind-food.bin"
          test -s "$RUNNER_TEMP/kfind-food.bin"

      - name: Inspect workbook without committing raw source
        shell: bash
        env:
          FILE_KEY: ${{ env.FILE_KEY }}
        run: |
          python - <<'PY'
          import hashlib,json,os,re,zipfile,xml.etree.ElementTree as ET
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'kfind-food.bin'
          data=p.read_bytes(); sha=hashlib.sha256(data).hexdigest()
          headers=(Path(os.environ['RUNNER_TEMP'])/'kfind-download.headers').read_text(errors='ignore')
          ctype=re.findall(r'(?im)^content-type:\s*([^\r\n]+)',headers)
          dispo=re.findall(r'(?im)^content-disposition:\s*([^\r\n]+)',headers)
          report={'observedAt':'2026-09-24','source':'K-FIND 음식 DB','bytes':len(data),'sha256':sha,'contentType':ctype[-1] if ctype else None,'contentDisposition':dispo[-1] if dispo else None,'zip':zipfile.is_zipfile(p),'workbook':None}
          if zipfile.is_zipfile(p):
              with zipfile.ZipFile(p) as z:
                  names=set(z.namelist())
                  if 'xl/workbook.xml' in names:
                      ns={'m':'http://schemas.openxmlformats.org/spreadsheetml/2006/main','r':'http://schemas.openxmlformats.org/officeDocument/2006/relationships'}
                      wb=ET.fromstring(z.read('xl/workbook.xml')); sheets=[]
                      for s in wb.findall('.//m:sheets/m:sheet',ns): sheets.append({'name':s.attrib.get('name'),'rid':s.attrib.get('{'+ns['r']+'}id')})
                      report['workbook']={'sheets':sheets,'entryCount':len(names)}
          Path('04_data/knowledge/kfind-food-download-smoke-v1.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          if len(data)<1_000_000: raise SystemExit('K-FIND download unexpectedly small')
          if not report['zip']: raise SystemExit('K-FIND food DB is not an XLSX-compatible archive')
          PY

      - name: Commit smoke evidence
        shell: bash
        run: |
          git config user.name 'GARANG K-FIND Ingestion'
          git config user.email 'actions@users.noreply.github.com'
          git add 04_data/knowledge/kfind-food-download-smoke-v1.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Verify official K-FIND food DB download [skip kfind-probe]'
          git push origin "HEAD:${GITHUB_REF_NAME}"

name: GARANG browser server migration
on:
  pull_request:
    paths:
      - scripts/migrate-browser-static-server.cjs
      - .github/workflows/browser-server-migration.yml
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Migrate browser tests to shared Node server
        run: node scripts/migrate-browser-static-server.cjs
      - name: Verify portability contract
        run: node tests/browser-server-portability.test.cjs
      - name: Commit migrated browser tests to this PR branch
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/browser*.cjs
          if git diff --cached --quiet; then
            echo "No browser test migration changes"
            exit 0
          fi
          git commit -m "Use Node static server in browser regressions"
          git push origin "HEAD:${HEAD_REF}"

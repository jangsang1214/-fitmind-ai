name: Agent Apply Coach Hardening
on:
  push:
    branches:
      - agent/coach-multimodal-hardening-2026-09-16
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/coach-multimodal-hardening-2026-09-16
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Apply deterministic patch
        run: python scripts/agent-apply-coach-hardening.py
      - name: Generate Functions lockfile
        run: npm install --package-lock-only --prefix functions --ignore-scripts --no-audit --no-fund
      - name: Verify patch diff
        run: git diff --check
      - name: Commit generated changes
        run: |
          rm .github/workflows/agent-apply-coach-hardening.yml scripts/agent-apply-coach-hardening.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Add Coach photo input and release hardening'
          git push origin HEAD:agent/coach-multimodal-hardening-2026-09-16

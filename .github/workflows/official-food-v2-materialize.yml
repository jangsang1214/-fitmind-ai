name: Official food v2 materialize
on:
  pull_request:
    paths:
      - '04_data/knowledge/kfind-home-analyzed-v2.json'
      - 'tests/food-data-quality-gate.test.cjs'
      - 'tmp/food-v2-payload.part1.b64'
      - 'tmp/food-v2-payload.part2.b64'
      - '.github/workflows/official-food-v2-materialize.yml'
permissions:
  contents: write
jobs:
  materialize:
    if: github.head_ref == 'agent/official-food-corpus-v2-2026-09-15'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/official-food-corpus-v2-2026-09-15
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reconstruct exact reviewed source from staged payload
        run: |
          cat tmp/food-v2-payload.part1.b64 tmp/food-v2-payload.part2.b64 | base64 -d | gzip -d > /tmp/kfind-home-analyzed-v2.json
          echo '3253706b963d4501a7ee9ee75555429f97ad87f48abaa11e9510b0d5b2329214  /tmp/kfind-home-analyzed-v2.json' | sha256sum -c -
          cp /tmp/kfind-home-analyzed-v2.json 04_data/knowledge/kfind-home-analyzed-v2.json
      - name: Verify exact source and pre-apply plan
        run: node tests/food-data-quality-gate.test.cjs
      - name: Apply reviewed official nutrition rows
        run: node scripts/apply-official-food-overrides.cjs --official 04_data/knowledge/kfind-home-analyzed-v2.json --write
      - name: Verify applied canonical corpus
        run: node tests/food-data-quality-gate.test.cjs
      - name: Commit materialized source and canonical food DB
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 04_data/knowledge/kfind-home-analyzed-v2.json 04_data/knowledge/food-db.json
          if git diff --cached --quiet; then
            echo 'No materialized changes required.'
            exit 0
          fi
          git commit -m 'Apply reviewed K-FIND corpus v2 overrides'
          git push

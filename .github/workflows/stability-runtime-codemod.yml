name: GARANG one-time runtime lifecycle stabilization
on:
  push:
    branches:
      - stability-runtime-freeze-20260907
permissions:
  contents: write
jobs:
  stabilize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stability-runtime-freeze-20260907
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply lifecycle codemod
        run: python3 scripts/stability_runtime_codemod.py
      - name: Verify static feature preservation and build
        run: |
          npm test
          npm run build
      - name: Commit structural stabilization
        run: |
          git rm .github/workflows/stability-runtime-codemod.yml scripts/stability_runtime_codemod.py
          git config user.name "garang-stability-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "refactor(stability): move high-risk UI reconciliation to lifecycle events"
          git push origin HEAD:stability-runtime-freeze-20260907

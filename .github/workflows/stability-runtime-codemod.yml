name: GARANG one-time runtime lifecycle stabilization
on:
  push:
    branches:
      - stability-runtime-freeze-20260907
permissions:
  contents: write
jobs:
  stabilize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stability-runtime-freeze-20260907
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply lifecycle codemod
        run: python3 scripts/stability_runtime_codemod.py
      - name: Normalize lifecycle regression contracts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for name in ['tests/stability-feature-preservation.test.cjs','tests/runtime-lifecycle-contract.test.cjs']:
              p=Path(name)
              text=p.read_text().replace("\\'use strict\\';", "'use strict';", 1)
              p.write_text(text)
          replacements={
            'garang-brand-runtime-v2.js?v=2.1.0-auth-pinned-coach':'garang-brand-runtime-v2.js?v=2.2.0-lifecycle',
            'garang-coach-agent-v4.js?v=4.4.0-auth-hydration-retry':'garang-coach-agent-v4.js?v=4.5.0-lifecycle',
            'garang-coach-decision-v1.js?v=1.3.0-compact-grid':'garang-coach-decision-v1.js?v=1.4.0-lifecycle',
            'garang-coach-profile-stability-v1.js?v=1.0.0':'garang-coach-profile-stability-v1.js?v=1.1.0-lifecycle',
            'garang-coach-item4-final.js?v=1.0.0':'garang-coach-item4-final.js?v=1.1.0-lifecycle',
            'garang-coach-home-hotfix.js?v=5.2.0-hit-test-safety':'garang-coach-home-hotfix.js?v=5.3.0-lifecycle',
            'garang-experience-v3.js?v=1.2.0-stability-final':'garang-experience-v3.js?v=1.3.0-lifecycle',
            'garang-experience-v4.js?v=1.5.0-stability-final':'garang-experience-v4.js?v=1.6.0-lifecycle'
          }
          for p in Path('tests').glob('*.cjs'):
              text=p.read_text()
              for old,new in replacements.items():
                  text=text.replace(old,new)
              p.write_text(text)
          PY
      - name: Verify static feature preservation and build
        run: |
          npm test
          npm run build
      - name: Commit structural stabilization
        run: |
          git rm .github/workflows/stability-runtime-codemod.yml scripts/stability_runtime_codemod.py
          git config user.name "garang-stability-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "refactor(stability): move high-risk UI reconciliation to lifecycle events"
          git push origin HEAD:stability-runtime-freeze-20260907

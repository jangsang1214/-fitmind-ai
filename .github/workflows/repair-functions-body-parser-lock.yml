name: Repair Functions body-parser lock

on:
  push:
    branches:
      - design/commercial-v4-clean-presentation
    paths:
      - .github/workflows/repair-functions-body-parser-lock.yml

permissions:
  contents: write

jobs:
  repair-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: design/commercial-v4-clean-presentation
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Update only the allowed transitive body-parser patch
        run: npm update --prefix functions body-parser --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify narrow lock change
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const pkg = require('./functions/package.json');
          const lock = require('./functions/package-lock.json');
          const body = lock.packages?.['node_modules/body-parser'];
          if (body?.version !== '1.20.9') throw new Error(`expected body-parser 1.20.9, got ${body?.version}`);
          const rootDeps = lock.packages?.['']?.dependencies || {};
          for (const [name, version] of Object.entries(pkg.dependencies || {})) {
            if (rootDeps[name] !== version) throw new Error(`root dependency drift: ${name} ${rootDeps[name]} != ${version}`);
          }
          if (Object.keys(rootDeps).length !== Object.keys(pkg.dependencies || {}).length) {
            throw new Error('unexpected direct dependency added to Functions lock');
          }
          console.log('narrow body-parser lock repair: PASS');
          NODE
          git diff --exit-code -- functions/package.json
          git diff -- functions/package-lock.json
      - name: Verify install and high-severity production audit
        run: |
          npm ci --prefix functions --ignore-scripts --no-audit --no-fund
          npm audit --prefix functions --omit=dev --audit-level=high
      - name: Commit repaired lock
        run: |
          if git diff --quiet -- functions/package-lock.json; then
            echo 'No lockfile change produced' >&2
            exit 1
          fi
          git config user.name 'garang-release-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add functions/package-lock.json
          git commit -m 'fix: patch Functions body-parser high advisory'
          git push origin HEAD:design/commercial-v4-clean-presentation

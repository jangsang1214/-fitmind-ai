name: Wanted Real AI Coach Activation

on:
  push:
    branches:
      - wanted/2026-release
    paths:
      - .github/workflows/wanted-coach-activation.yml
      - functions/**
      - scripts/smoke-wanted-coach-prod.cjs
      - firebase.json

permissions:
  contents: read

concurrency:
  group: wanted-real-ai-coach-activation
  cancel-in-progress: false

jobs:
  activate:
    if: contains(github.event.head_commit.message, 'Enable Wanted Real AI Coach')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out approved Wanted revision
        uses: actions/checkout@v7

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install locked Functions runtime dependencies
        run: npm ci --prefix functions --omit=dev --no-audit --no-fund

      - name: Select fail-closed Firebase authentication
        id: auth
        shell: bash
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT_FITFIND_AI: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FITFIND_AI }}
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
        run: |
          set -euo pipefail
          cred_file="$RUNNER_TEMP/firebase-service-account.json"
          if [[ -n "${FIREBASE_SERVICE_ACCOUNT_FITFIND_AI:-}" ]]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_FITFIND_AI" > "$cred_file"
            node -e "JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'))" "$cred_file"
            echo "GOOGLE_APPLICATION_CREDENTIALS=$cred_file" >> "$GITHUB_ENV"
            echo "mode=adc-service-account-fitfind" >> "$GITHUB_OUTPUT"
          elif [[ -n "${GOOGLE_APPLICATION_CREDENTIALS_JSON:-}" ]]; then
            printf '%s' "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > "$cred_file"
            node -e "JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'))" "$cred_file"
            echo "GOOGLE_APPLICATION_CREDENTIALS=$cred_file" >> "$GITHUB_ENV"
            echo "mode=adc-service-account-generic" >> "$GITHUB_OUTPUT"
          elif [[ -n "${FIREBASE_TOKEN:-}" ]]; then
            echo "mode=legacy-firebase-token" >> "$GITHUB_OUTPUT"
          else
            echo "::error::No Firebase deployment credential is configured."
            exit 42
          fi

      - name: Verify production project access
        shell: bash
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          set -euo pipefail
          if [[ "${{ steps.auth.outputs.mode }}" != "legacy-firebase-token" ]]; then unset FIREBASE_TOKEN; fi
          npx firebase projects:list --json > "$RUNNER_TEMP/firebase-projects.json"
          node - "$RUNNER_TEMP/firebase-projects.json" <<'NODE'
          const fs=require('fs');
          const raw=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const rows=Array.isArray(raw)?raw:Array.isArray(raw.result)?raw.result:[];
          if(!rows.some(project=>project.projectId==='fitfind-ai'))process.exit(43);
          console.log('fitfind-ai credential access verified.');
          NODE

      - name: Require existing GARANG LLM secret
        shell: bash
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          set -euo pipefail
          if [[ "${{ steps.auth.outputs.mode }}" != "legacy-firebase-token" ]]; then unset FIREBASE_TOKEN; fi
          npx firebase functions:secrets:get GARANG_LLM_API_KEY --project fitfind-ai > /dev/null
          echo "Existing GARANG_LLM_API_KEY metadata found; preserving current value."

      - name: Deploy approved production api Function
        shell: bash
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          set -euo pipefail
          if [[ "${{ steps.auth.outputs.mode }}" != "legacy-firebase-token" ]]; then unset FIREBASE_TOKEN; fi
          npx firebase deploy --only functions:api --project fitfind-ai --non-interactive

      - name: Verify canonical Coach stays auth-closed
        run: npm run preflight:coach:prod-route

      - name: Verify Wanted public Coach returns Real LLM
        run: node scripts/smoke-wanted-coach-prod.cjs

      - name: Remove temporary Firebase credential material
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/firebase-service-account.json" "$RUNNER_TEMP/firebase-projects.json"

      - name: Record non-secret Wanted activation evidence
        if: always()
        shell: bash
        run: |
          {
            echo "## GARANG Wanted Real AI Coach Activation"
            echo "- Project: \`fitfind-ai\`"
            echo "- Function: \`api\` / \`asia-northeast3\`"
            echo "- Wanted revision: \`${GITHUB_SHA}\`"
            echo "- Stable origin: \`https://garang-wanted-2026-jangsang1214.vercel.app\`"
            echo "- Canonical /coach remains Firebase-authenticated."
            echo "- /wanted/coach accepts only the synthetic judging contract and is quota/expiry constrained."
          } >> "$GITHUB_STEP_SUMMARY"

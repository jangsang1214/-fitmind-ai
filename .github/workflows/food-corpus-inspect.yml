name: Food corpus inspect
on:
  pull_request:
    paths:
      - '.github/workflows/food-corpus-inspect.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify only reviewed nutrition rows changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          node - <<'NODE'
          const assert=require('node:assert/strict');
          const {execFileSync}=require('node:child_process');
          const Food=require('./02_core/food-data-foundation-v2.js');
          const base=JSON.parse(execFileSync('git',['show',`${process.env.BASE_SHA}:04_data/knowledge/food-db.json`],{encoding:'utf8'}));
          const head=require('./04_data/knowledge/food-db.json');
          const official=require('./04_data/knowledge/kfind-home-analyzed-v2.json');
          assert.equal(base.length,500); assert.equal(head.length,500);
          const officialByName=new Map(official.records.map(r=>[Food.normalizedName(r.name),r]));
          const allowed=new Set(['basis_g','nutrition_basis_g','kcal','protein','carbs','fat','sugar','fiber','sodium','cholesterol','saturated_fat','trans_fat','source','source_date','nutrition_status','provenance']);
          const strip=row=>Object.fromEntries(Object.entries(row).filter(([key])=>!allowed.has(key)));
          const changed=[];
          for(let i=0;i<base.length;i++){
            const before=base[i],after=head[i];
            assert.equal(after.food_id,before.food_id,`food id changed at ${i}`);
            assert.equal(after.name,before.name,`food name changed: ${before.food_id}`);
            assert.equal(after.category,before.category,`food category changed: ${before.food_id}`);
            assert.equal(after.serving,before.serving,`food serving changed: ${before.food_id}`);
            assert.deepEqual(strip(after),strip(before),`non-nutrition fields changed: ${before.food_id}`);
            if(JSON.stringify(before)!==JSON.stringify(after))changed.push(after);
          }
          const expected=official.records.filter(r=>{
            const before=base.find(x=>Food.normalizedName(x.name)===Food.normalizedName(r.name));
            return before && String(before.nutrition_status).toLowerCase()!=='verified';
          });
          assert.equal(expected.length,76,'expected exactly 76 new official upgrades');
          assert.equal(changed.length,76,'canonical diff must contain exactly 76 changed food rows');
          assert.deepEqual(new Set(changed.map(r=>Food.normalizedName(r.name))),new Set(expected.map(r=>Food.normalizedName(r.name))),'changed row set must equal reviewed official v2 targets');
          for(const row of changed){
            const src=officialByName.get(Food.normalizedName(row.name));
            assert.ok(src,`changed row missing official source: ${row.name}`);
            assert.equal(row.nutrition_status,'verified');
            assert.equal(row.provenance.provider,'MFDS K-FIND');
            assert.equal(row.provenance.dataset,'KDDB_HOME_ANALYZED');
            assert.equal(row.provenance.recordId,src.recordId);
            const map={kcal:'kcal',protein:'protein',carbs:'carbs',fat:'fat',sugar:'sugar',fiber:'fiber',sodium:'sodium',cholesterol:'cholesterol',saturatedFat:'saturated_fat',transFat:'trans_fat'};
            for(const [sourceKey,targetKey] of Object.entries(map))assert.equal(row[targetKey],src.nutrients[sourceKey],`${row.name} ${sourceKey} differs from official source`);
          }
          const untouched=500-changed.length;
          console.log(JSON.stringify({status:'PASS',changedRows:changed.length,untouchedRows:untouched,verifiedAfter:head.filter(x=>x.nutrition_status==='verified').length,changedNames:changed.map(x=>x.name)},null,2));
          console.log('official-food-v2-diff-scope: PASS');
          NODE

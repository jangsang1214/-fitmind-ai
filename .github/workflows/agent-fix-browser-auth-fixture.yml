name: Agent Fix Browser Auth Fixture
on:
  push:
    branches:
      - agent/coach-multimodal-hardening-2026-09-16
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/coach-multimodal-hardening-2026-09-16
      - name: Patch legacy demo browser fixture
        run: python scripts/patch-browser-auth-fixture.py
      - name: Verify fixture contract
        run: |
          git diff --check
          node tests/no-demo-entry.test.cjs
      - name: Commit browser fixture migration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/browser-interaction.test.cjs
          git diff --cached --quiet && exit 0
          git commit -m "Migrate browser interaction test to authenticated fixture"
          git push origin HEAD:agent/coach-multimodal-hardening-2026-09-16

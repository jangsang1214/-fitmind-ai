name: GARANG lockfile seed
on:
  pull_request:
    paths:
      - package.json
      - .github/workflows/lockfile-seed.yml
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate deterministic npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Validate lockfile contract
        run: |
          node - <<'NODE'
          const p=require('./package-lock.json');
          const d=p.packages?.['']?.devDependencies||{};
          const expected={
            playwright:'1.55.0',
            firebase:'10.13.0',
            'firebase-tools':'13.35.1',
            '@firebase/rules-unit-testing':'3.0.3'
          };
          for(const [k,v] of Object.entries(expected)){
            if(d[k]!==v)throw new Error(`${k} lock mismatch: ${d[k]}`);
          }
          if(p.lockfileVersion!==3)throw new Error(`expected lockfileVersion 3, got ${p.lockfileVersion}`);
          console.log('lockfile seed PASS');
          NODE
      - name: Commit generated lockfile to this PR branch
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ -z "$(git status --porcelain -- package-lock.json)" ]; then
            echo "package-lock.json already matches"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Lock GARANG CI dependency graph"
          git push origin "HEAD:${HEAD_REF}"

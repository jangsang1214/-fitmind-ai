name: Probe K-FIND Download

on:
  push:
    branches:
      - ai/korean-food-source-acquisition-v2-20260924
    paths:
      - .github/workflows/probe-kfind-download.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    if: ${{ !contains(github.event.head_commit.message || '', '[skip kfind-probe]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Fetch official K-FIND pages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/kfind"
          BASE='https://various.foodsafetykorea.go.kr'
          curl --fail --location --retry 3 --silent --show-error \
            "$BASE/nutrient/general/down/historyList.do" -o "$RUNNER_TEMP/kfind/history.html"
          curl --fail --location --retry 3 --silent --show-error \
            "$BASE/nutrient/export/down/filePop.do?pagenum=1&totalListCnt=17&pageblock=10&pagesize=10&searchDbSeq=1787898710194&searchDbGubun=02&searchOpenApi=Y" \
            -o "$RUNNER_TEMP/kfind/food-popup.html"
          curl --fail --location --retry 3 --silent --show-error \
            "$BASE/nutrient/export/down/filePop.do?pagenum=1&totalListCnt=17&pageblock=10&pagesize=10&searchDbSeq=1787898734821&searchDbGubun=01&searchOpenApi=Y" \
            -o "$RUNNER_TEMP/kfind/processed-popup.html"

      - name: Inspect forms, scripts and download endpoints
        shell: bash
        run: |
          python - <<'PY'
          import json,re,urllib.parse,urllib.request
          from pathlib import Path
          from html.parser import HTMLParser
          root=Path.home()/ 'work'
          tmp=Path(__import__('os').environ['RUNNER_TEMP'])/'kfind'
          base='https://various.foodsafetykorea.go.kr'
          class Parser(HTMLParser):
              def __init__(self):
                  super().__init__(); self.forms=[]; self.inputs=[]; self.scripts=[]; self.current=None
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if tag=='form': self.forms.append(a)
                  elif tag in ('input','select','textarea','button'): self.inputs.append({'tag':tag,**a})
                  elif tag=='script' and a.get('src'): self.scripts.append(a['src'])
          report={'observedAt':'2026-09-24','officialBase':base,'pages':{},'scripts':{},'candidates':[]}
          for name in ('history','food-popup','processed-popup'):
              p=tmp/(name+'.html'); text=p.read_text(errors='ignore'); parser=Parser(); parser.feed(text)
              report['pages'][name]={'forms':parser.forms,'inputs':parser.inputs,'scripts':parser.scripts,'size':len(text)}
              pats=re.findall(r'''(?:action|url|href)\s*[:=]\s*["']([^"']*(?:down|download|file|excel|export)[^"']*)["']''',text,re.I)
              report['candidates'] += [{'source':name,'value':x} for x in pats[:100]]
              for src in parser.scripts:
                  url=urllib.parse.urljoin(base+'/nutrient/',src)
                  if url in report['scripts']: continue
                  try:
                      req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
                      js=urllib.request.urlopen(req,timeout=20).read().decode('utf-8','ignore')
                  except Exception as e:
                      report['scripts'][url]={'error':str(e)}; continue
                  hits=[]
                  for m in re.finditer(r'.{0,180}(?:filePop|fileDown|download|downFile|excel|searchDbSeq|searchDbGubun).{0,260}',js,re.I|re.S):
                      s=re.sub(r'\s+',' ',m.group(0)).strip()
                      if s not in hits: hits.append(s[:700])
                      if len(hits)>=30: break
                  report['scripts'][url]={'size':len(js),'hits':hits}
          out=Path('04_data/knowledge/kfind-download-probe-v1.json')
          out.write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(report,ensure_ascii=False,indent=2)[:20000])
          PY

      - name: Commit probe report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'GARANG K-FIND Probe'
          git config user.email 'actions@users.noreply.github.com'
          git add 04_data/knowledge/kfind-download-probe-v1.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record K-FIND download probe [skip kfind-probe]'
          git push origin "HEAD:${GITHUB_REF_NAME}"

name: Production Coach Live Smoke
# Manual verification trigger: 2026-09-20 external AI connection diagnosis

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/production-coach-live-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-coach-live-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GARANG_COACH_ENDPOINT: https://asia-northeast3-fitfind-ai.cloudfunctions.net/api/coach
    steps:
      - name: Check out verified production revision
        uses: actions/checkout@v7

      - name: Mint disposable Firebase ID token
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('node:fs');
          const crypto=require('node:crypto');
          const config=fs.readFileSync('07_config/firebase-config.js','utf8');
          const apiKey=config.match(/apiKey:\s*"([^"]+)"/)?.[1];
          if(!apiKey)throw new Error('FIREBASE_WEB_API_KEY_NOT_FOUND');
          const email=`garang.smoke.${process.env.GITHUB_RUN_ID}.${process.env.GITHUB_RUN_ATTEMPT}.${crypto.randomUUID()}@example.com`;
          const password=`Gg!${crypto.randomBytes(18).toString('hex')}Aa1`;
          (async()=>{
            const response=await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=${encodeURIComponent(apiKey)}`,{
              method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password,returnSecureToken:true})
            });
            const body=await response.json().catch(()=>({}));
            if(!response.ok||!body.idToken)throw new Error(`FIREBASE_SMOKE_SIGNUP_FAILED:${body?.error?.message||response.status}`);
            console.log(`::add-mask::${body.idToken}`);
            if(body.refreshToken)console.log(`::add-mask::${body.refreshToken}`);
            fs.appendFileSync(process.env.GITHUB_ENV,`GARANG_FIREBASE_ID_TOKEN=${body.idToken}\nGARANG_FIREBASE_WEB_API_KEY=${apiKey}\n`);
            console.log(`Disposable Firebase smoke identity created; expiresIn=${body.expiresIn||'unknown'}s.`);
          })().catch(error=>{console.error(error.message||error);process.exit(1);});
          NODE

      - name: Verify authenticated production text Coach
        env:
          GARANG_SMOKE_MESSAGE: 오늘 내 기록 기준으로 가장 중요한 다음 행동 하나를 설명해줘.
          GARANG_SMOKE_LANGUAGE: ko
        run: npm run smoke:coach:prod

      - name: Verify authenticated production photo Coach
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('node:fs');
          const assert=require('node:assert/strict');
          const token=String(process.env.GARANG_FIREBASE_ID_TOKEN||'').trim();
          const endpoint=String(process.env.GARANG_COACH_ENDPOINT||'').trim();
          if(!token||!endpoint)throw new Error('PHOTO_SMOKE_ENV_MISSING');
          const image=fs.readFileSync('05_assets/garang-app-icon-exact.png').toString('base64');
          (async()=>{
            const response=await fetch(endpoint,{method:'POST',headers:{Authorization:`Bearer ${token}`,'Content-Type':'application/json'},body:JSON.stringify({message:'이 이미지를 내 GARANG 기록과 함께 보고, 훈련 관점에서 확인 가능한 내용만 설명해줘.',language:'ko',image:{kind:'body_photo',mediaType:'image/png',dataUrl:`data:image/png;base64,${image}`}})});
            const body=await response.json().catch(()=>({}));
            assert.equal(response.ok,true,`photo Coach failed HTTP ${response.status} code=${body?.error?.code||'unknown'}`);
            const data=body?.data||{};
            assert.equal(data.source,'llm','photo Coach did not return source=llm');
            assert.ok(data.garangDecision?.decisionId,'photo Coach deterministic GARANG decision missing');
            assert.equal(data.metadata?.alignment?.contractVerified,true,'photo Coach provider alignment not verified');
            assert.equal(data.metadata?.alignment?.decisionId,data.garangDecision.decisionId,'photo Coach decision identity diverged from GARANG');
            assert.equal(data.metadata?.grounding?.contractVerified,true,'photo Coach grounding contract not verified');
            console.log(JSON.stringify({status:'PASS',source:data.source,decisionMode:data.garangDecision.mode||null,provider:String(data.metadata?.provider||'unknown'),model:String(data.metadata?.model||'unknown'),alignmentVerified:true,groundingVerified:true,hasImage:true},null,2));
          })().catch(error=>{console.error(`production photo Coach smoke: FAIL ${error?.message||error}`);process.exit(1);});
          NODE

      - name: Delete disposable Firebase smoke identity
        if: always()
        shell: bash
        run: |
          set +e
          node <<'NODE'
          const token=String(process.env.GARANG_FIREBASE_ID_TOKEN||'').trim();
          const apiKey=String(process.env.GARANG_FIREBASE_WEB_API_KEY||'').trim();
          if(!token||!apiKey){console.log('No disposable Firebase identity to delete.');process.exit(0);}
          (async()=>{
            const response=await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:delete?key=${encodeURIComponent(apiKey)}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({idToken:token})});
            if(!response.ok){const body=await response.json().catch(()=>({}));console.error(`Disposable Firebase identity cleanup failed: ${body?.error?.message||response.status}`);process.exit(1);}
            console.log('Disposable Firebase smoke identity deleted.');
          })().catch(error=>{console.error(error.message||error);process.exit(1);});
          NODE

      - name: Record non-secret smoke evidence
        if: always()
        shell: bash
        run: |
          {
            echo "## GARANG Production Coach Live Smoke"
            echo "- Project: \`fitfind-ai\`"
            echo "- Endpoint: \`asia-northeast3-fitfind-ai.cloudfunctions.net/api/coach\`"
            echo "- Revision: \`${GITHUB_SHA}\`"
            echo "- Authentication: disposable Firebase email/password identity; ID token masked and not persisted"
            echo "- Cleanup: disposable identity deletion attempted in an always step"
          } >> "$GITHUB_STEP_SUMMARY"

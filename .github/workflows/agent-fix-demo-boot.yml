name: Agent Fix Demo Boot
on:
  push:
    branches:
      - agent/coach-multimodal-hardening-2026-09-16
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/coach-multimodal-hardening-2026-09-16
      - name: Remove final signed-out demo boot path
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('01_app/app.js')
          s=p.read_text()
          old="async function boot(){storageKey=DEMO_KEY;loadLocal(storageKey);bindAuth();nav();initFirebase();registerSW();if(localStorage.getItem('garang_demo')==='1'&&!firebaseReady)showApp();else if(!firebaseReady)showAuth();loadDB().then(()=>{if(!$('appView')?.hidden)render();}).catch(e=>{captureError('db_load',e);toast('일부 운동/식단 데이터는 연결 후 다시 불러옵니다.');});}"
          new="async function boot(){storageKey=SIGNED_OUT_KEY;loadLocal(storageKey);bindAuth();nav();initFirebase();registerSW();if(!firebaseReady)showAuth();loadDB().then(()=>{if(!$('appView')?.hidden)render();}).catch(e=>{captureError('db_load',e);toast('일부 운동/식단 데이터는 연결 후 다시 불러옵니다.');});}"
          if old not in s:
              raise SystemExit('expected legacy demo boot block not found')
          p.write_text(s.replace(old,new,1))
          PY
          git diff --check
          node tests/no-demo-entry.test.cjs
      - name: Commit product fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add 01_app/app.js
          git diff --cached --quiet && exit 0
          git commit -m "Remove final signed-out demo boot path"
          git push origin HEAD:agent/coach-multimodal-hardening-2026-09-16

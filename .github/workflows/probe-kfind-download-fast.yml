name: Probe K-FIND Download Fast

on:
  push:
    branches:
      - ai/korean-food-source-acquisition-v2-20260924
    paths:
      - .github/workflows/probe-kfind-download-fast.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Fetch and parse K-FIND popup HTML
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/kfind-fast"
          URL='https://various.foodsafetykorea.go.kr/nutrient/export/down/filePop.do?pagenum=1&totalListCnt=17&pageblock=10&pagesize=10&searchDbSeq=1787898710194&searchDbGubun=02&searchOpenApi=Y'
          curl --fail --location --retry 3 --silent --show-error "$URL" -o "$RUNNER_TEMP/kfind-fast/popup.html"
          python - <<'PY'
          import json,re,os
          from pathlib import Path
          from html.parser import HTMLParser
          p=Path(os.environ['RUNNER_TEMP'])/'kfind-fast'/'popup.html'
          text=p.read_text(errors='ignore')
          class P(HTMLParser):
              def __init__(self): super().__init__(); self.forms=[]; self.fields=[]; self.buttons=[]
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if tag=='form': self.forms.append(a)
                  elif tag in ('input','select','textarea'): self.fields.append({'tag':tag,**a})
                  elif tag in ('button','a'): self.buttons.append({'tag':tag,**a})
          x=P(); x.feed(text)
          snippets=[]
          for pat in [r'[^\n]{0,200}\.submit\([^\n]{0,300}',r'[^\n]{0,200}(?:download|fileDown|downFile|filePop|searchDbSeq|searchDbGubun)[^\n]{0,400}',r'[^\n]{0,200}action\s*=\s*["\'][^"\']+["\'][^\n]{0,200}']:
              for m in re.finditer(pat,text,re.I):
                  s=re.sub(r'\s+',' ',m.group(0)).strip()
                  if s not in snippets: snippets.append(s[:900])
                  if len(snippets)>=80: break
          report={'observedAt':'2026-09-24','sourceUrl':'https://various.foodsafetykorea.go.kr/nutrient/export/down/filePop.do','forms':x.forms,'fields':x.fields,'buttons':x.buttons,'inlineSnippets':snippets,'htmlBytes':len(text)}
          Path('04_data/knowledge/kfind-download-probe-fast-v1.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(report,ensure_ascii=False,indent=2)[:25000])
          PY

      - name: Commit fast probe report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'GARANG K-FIND Probe'
          git config user.email 'actions@users.noreply.github.com'
          git add 04_data/knowledge/kfind-download-probe-fast-v1.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record fast K-FIND form probe [skip kfind-probe]'
          git push origin "HEAD:${GITHUB_REF_NAME}"

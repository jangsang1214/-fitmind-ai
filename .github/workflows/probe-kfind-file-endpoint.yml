name: Probe K-FIND File Endpoint

on:
  push:
    branches:
      - ai/korean-food-source-acquisition-v2-20260924
    paths:
      - .github/workflows/probe-kfind-file-endpoint.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Find ComFileDownDirect implementation
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://various.foodsafetykorea.go.kr'
          POP="$BASE/nutrient/export/down/filePop.do?pagenum=1&totalListCnt=17&pageblock=10&pagesize=10&searchDbSeq=1787898710194&searchDbGubun=02&searchOpenApi=Y"
          curl --fail --location --retry 3 --silent --show-error "$POP" -o "$RUNNER_TEMP/popup.html"
          python - <<'PY'
          import re,json,os,urllib.parse,urllib.request
          from pathlib import Path
          html=(Path(os.environ['RUNNER_TEMP'])/'popup.html').read_text(errors='ignore')
          base='https://various.foodsafetykorea.go.kr'
          srcs=re.findall(r'<script[^>]+src=["\']([^"\']+)["\']',html,re.I)
          report={'scripts':srcs,'matches':[]}
          for src in srcs:
              url=urllib.parse.urljoin(base+'/nutrient/',src)
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
                  js=urllib.request.urlopen(req,timeout=6).read().decode('utf-8','ignore')
              except Exception as e:
                  continue
              if 'ComFileDownDirect' not in js: continue
              for m in re.finditer(r'ComFileDownDirect',js):
                  s=max(0,m.start()-1200);e=min(len(js),m.end()+2500)
                  report['matches'].append({'url':url,'snippet':js[s:e]})
                  if len(report['matches'])>=10: break
          Path('04_data/knowledge/kfind-file-endpoint-probe-v1.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(report,ensure_ascii=False,indent=2)[:30000])
          PY
      - name: Commit endpoint probe
        shell: bash
        run: |
          git config user.name 'GARANG K-FIND Probe'
          git config user.email 'actions@users.noreply.github.com'
          git add 04_data/knowledge/kfind-file-endpoint-probe-v1.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record K-FIND file endpoint probe [skip kfind-probe]'
          git push origin "HEAD:${GITHUB_REF_NAME}"

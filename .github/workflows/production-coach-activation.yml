name: Production Coach Activation

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/production-coach-activation.yml
      - functions/**
      - firebase.json

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-coach-activation
  cancel-in-progress: false

jobs:
  activate:
    if: contains(github.event.head_commit.message, 'Activate production Real AI Coach')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out approved revision
        uses: actions/checkout@v7

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install locked Functions runtime dependencies
        run: npm ci --prefix functions --omit=dev --no-audit --no-fund

      - name: Validate Workload Identity Federation configuration
        id: wif_config
        shell: bash
        env:
          REQUIRE_WIF: ${{ contains(github.event.head_commit.message, 'via WIF') }}
          WIF_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          WIF_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          provider_set=0
          service_account_set=0
          [[ -n "${WIF_PROVIDER:-}" ]] && provider_set=1
          [[ -n "${WIF_SERVICE_ACCOUNT:-}" ]] && service_account_set=1
          if [[ "$provider_set" != "$service_account_set" ]]; then
            echo "::error::WIF configuration is partial. Configure both GCP_WORKLOAD_IDENTITY_PROVIDER and GCP_DEPLOY_SERVICE_ACCOUNT."
            exit 45
          fi
          if [[ "${REQUIRE_WIF:-false}" == "true" && "$provider_set" != "1" ]]; then
            echo "::error::This activation requires Workload Identity Federation, but repository WIF variables are not configured."
            exit 46
          fi
          if [[ "$provider_set" == "1" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Authenticate with Google Workload Identity Federation
        if: ${{ steps.wif_config.outputs.configured == 'true' }}
        id: google_auth
        uses: google-github-actions/auth@v3
        with:
          project_id: fitfind-ai
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Select fail-closed Firebase authentication
        id: auth
        shell: bash
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT_FITFIND_AI: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FITFIND_AI }}
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
        run: |
          set -euo pipefail
          cred_file="$RUNNER_TEMP/firebase-service-account.json"
          if [[ -n "${GOOGLE_GHA_CREDS_PATH:-}" && -f "${GOOGLE_GHA_CREDS_PATH}" ]]; then
            echo "mode=wif-service-account" >> "$GITHUB_OUTPUT"
          elif [[ "${{ contains(github.event.head_commit.message, 'via WIF') }}" == "true" ]]; then
            echo "::error::WIF-required activation did not produce a Google federated credential. Refusing long-lived credential fallback."
            exit 47
          elif [[ -n "${FIREBASE_SERVICE_ACCOUNT_FITFIND_AI:-}" ]]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_FITFIND_AI" > "$cred_file"
            node -e "JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'))" "$cred_file"
            echo "GOOGLE_APPLICATION_CREDENTIALS=$cred_file" >> "$GITHUB_ENV"
            echo "mode=adc-service-account-fitfind" >> "$GITHUB_OUTPUT"
          elif [[ -n "${GOOGLE_APPLICATION_CREDENTIALS_JSON:-}" ]]; then
            printf '%s' "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > "$cred_file"
            node -e "JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'))" "$cred_file"
            echo "GOOGLE_APPLICATION_CREDENTIALS=$cred_file" >> "$GITHUB_ENV"
            echo "mode=adc-service-account-generic" >> "$GITHUB_OUTPUT"
          elif [[ -n "${FIREBASE_TOKEN:-}" ]]; then
            echo "mode=legacy-firebase-token" >> "$GITHUB_OUTPUT"
          else
            echo "::error::No Firebase deployment credential is configured. Expected configured Workload Identity Federation or FIREBASE_SERVICE_ACCOUNT_FITFIND_AI, GOOGLE_APPLICATION_CREDENTIALS_JSON, or FIREBASE_TOKEN."
            exit 42
          fi

      - name: Verify production project access
        shell: bash
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          set -euo pipefail
          if [[ "${{ steps.auth.outputs.mode }}" != "legacy-firebase-token" ]]; then unset FIREBASE_TOKEN; fi
          npx firebase projects:list --json > "$RUNNER_TEMP/firebase-projects.json"
          node - "$RUNNER_TEMP/firebase-projects.json" <<'NODE'
          const fs=require('fs');
          const raw=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const rows=Array.isArray(raw)?raw:Array.isArray(raw.result)?raw.result:[];
          if(!rows.some(project=>project.projectId==='fitfind-ai')){
            console.error('fitfind-ai is not accessible with the configured Firebase credential.');
            process.exit(43);
          }
          console.log('fitfind-ai credential access verified.');
          NODE

      - name: Confirm or configure GARANG LLM secret
        shell: bash
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          GARANG_LLM_API_KEY: ${{ secrets.GARANG_LLM_API_KEY }}
        run: |
          set -euo pipefail
          if [[ "${{ steps.auth.outputs.mode }}" != "legacy-firebase-token" ]]; then unset FIREBASE_TOKEN; fi
          if npx firebase functions:secrets:get GARANG_LLM_API_KEY --project fitfind-ai > /dev/null 2>&1; then
            echo "Existing GARANG_LLM_API_KEY metadata found; preserving the current production secret value."
          elif [[ -n "${GARANG_LLM_API_KEY:-}" ]]; then
            printf '%s' "$GARANG_LLM_API_KEY" | npx firebase functions:secrets:set GARANG_LLM_API_KEY --project fitfind-ai
            echo "GARANG_LLM_API_KEY created from the masked GitHub Actions secret."
          else
            echo "::error::GARANG_LLM_API_KEY is absent from Firebase Secret Manager and no masked GitHub secret is available to create it."
            exit 44
          fi

      - name: Deploy only the approved production api Function
        shell: bash
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          set -euo pipefail
          if [[ "${{ steps.auth.outputs.mode }}" != "legacy-firebase-token" ]]; then unset FIREBASE_TOKEN; fi
          npx firebase deploy --only functions:api --project fitfind-ai --non-interactive

      - name: Verify public Coach auth and method boundaries
        run: npm run preflight:coach:prod-route

      - name: Verify public Meal Scan auth and method boundaries
        run: npm run preflight:meal-scan:prod-route

      - name: Verify public nutrition lookup auth and method boundaries
        run: npm run preflight:nutrition-lookup:prod-route

      - name: Mint disposable Firebase ID token
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('node:fs');
          const crypto=require('node:crypto');
          const config=fs.readFileSync('07_config/firebase-config.js','utf8');
          const apiKey=config.match(/apiKey:\s*"([^"]+)"/)?.[1];
          if(!apiKey)throw new Error('FIREBASE_WEB_API_KEY_NOT_FOUND');
          const email=`garang.smoke.${process.env.GITHUB_RUN_ID}.${process.env.GITHUB_RUN_ATTEMPT}.${crypto.randomUUID()}@example.com`;
          const password=`Gg!${crypto.randomBytes(18).toString('hex')}Aa1`;
          (async()=>{
            const response=await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=${encodeURIComponent(apiKey)}`,{
              method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password,returnSecureToken:true})
            });
            const body=await response.json().catch(()=>({}));
            if(!response.ok||!body.idToken)throw new Error(`FIREBASE_SMOKE_SIGNUP_FAILED:${body?.error?.message||response.status}`);
            console.log(`::add-mask::${body.idToken}`);
            if(body.refreshToken)console.log(`::add-mask::${body.refreshToken}`);
            fs.appendFileSync(process.env.GITHUB_ENV,`GARANG_FIREBASE_ID_TOKEN=${body.idToken}\nGARANG_FIREBASE_WEB_API_KEY=${apiKey}\n`);
            console.log('Disposable Firebase smoke identity created.');
          })().catch(error=>{console.error(error.message||error);process.exit(1);});
          NODE

      - name: Run authenticated live Meal Scan smoke
        id: live_meal_scan_smoke
        shell: bash
        run: |
          set -euo pipefail
          npm run smoke:meal-scan:prod
          echo "status=PASS" >> "$GITHUB_OUTPUT"

      - name: Run authenticated live nutrition lookup smoke
        id: live_nutrition_lookup_smoke
        shell: bash
        run: |
          set -euo pipefail
          npm run smoke:nutrition-lookup:prod
          echo "status=PASS" >> "$GITHUB_OUTPUT"

      - name: Run authenticated live Coach smoke
        id: live_smoke
        shell: bash
        run: |
          set -euo pipefail
          npm run smoke:coach:prod
          echo "status=PASS" >> "$GITHUB_OUTPUT"

      - name: Run authenticated autonomous write smoke
        id: live_write_smoke
        shell: bash
        run: |
          set -euo pipefail
          npm run smoke:coach:prod-write
          echo "status=PASS" >> "$GITHUB_OUTPUT"

      - name: Delete disposable Firebase smoke identity
        if: always()
        shell: bash
        run: |
          set +e
          node <<'NODE'
          const token=String(process.env.GARANG_FIREBASE_ID_TOKEN||'').trim();
          const apiKey=String(process.env.GARANG_FIREBASE_WEB_API_KEY||'').trim();
          if(process.env.GARANG_SMOKE_ACCOUNT_DELETED==='1'){console.log('Disposable Firebase smoke account already deleted through the authenticated account boundary.');process.exit(0);}
          if(!token||!apiKey){console.log('No disposable Firebase identity to delete.');process.exit(0);}
          (async()=>{
            const response=await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:delete?key=${encodeURIComponent(apiKey)}`,{
              method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({idToken:token})
            });
            if(!response.ok){const body=await response.json().catch(()=>({}));console.error(`Disposable Firebase identity cleanup failed: ${body?.error?.message||response.status}`);process.exit(1);}
            console.log('Disposable Firebase smoke identity deleted.');
          })().catch(error=>{console.error(error.message||error);process.exit(1);});
          NODE

      - name: Remove temporary Firebase credential material
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/firebase-service-account.json" "$RUNNER_TEMP/firebase-projects.json"

      - name: Record non-secret activation evidence
        if: always()
        shell: bash
        run: |
          {
            echo "## GARANG Production Coach Activation"
            echo "- Project: \`fitfind-ai\`"
            echo "- Function: \`api\` / \`asia-northeast3\`"
            echo "- Repository revision: \`${GITHUB_SHA}\`"
            echo "- Firebase auth mode: \`${{ steps.auth.outputs.mode || 'unavailable' }}\`"
            echo "- Authenticated live smoke: \`${{ steps.live_smoke.outputs.status || 'NOT_REACHED' }}\`"
            echo "- Authenticated Meal Scan smoke: \`${{ steps.live_meal_scan_smoke.outputs.status || 'NOT_REACHED' }}\`"
            echo "- Authenticated nutrition lookup smoke: \`${{ steps.live_nutrition_lookup_smoke.outputs.status || 'NOT_REACHED' }}\`"
            echo "- Secret values were scoped to the minimum required steps and were not printed or persisted to repository files."
          } >> "$GITHUB_STEP_SUMMARY"

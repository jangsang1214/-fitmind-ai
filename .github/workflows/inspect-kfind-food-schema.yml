name: Inspect K-FIND Food Schema

on:
  push:
    branches:
      - ai/korean-food-source-acquisition-v2-20260924
    paths:
      - .github/workflows/inspect-kfind-food-schema.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Download latest K-FIND food workbook
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://various.foodsafetykorea.go.kr'
          POP="$BASE/nutrient/export/down/filePop.do?pagenum=1&totalListCnt=17&pageblock=10&pagesize=10&searchDbSeq=1787898710194&searchDbGubun=02&searchOpenApi=Y"
          JAR="$RUNNER_TEMP/kfind.cookies"
          curl --fail --location --retry 3 --silent --show-error -c "$JAR" -b "$JAR" "$POP" -o "$RUNNER_TEMP/popup.html"
          python - <<'PY' > "$RUNNER_TEMP/kfind.env"
          import re,os
          from pathlib import Path
          text=Path(os.environ['RUNNER_TEMP']+'/popup.html').read_text(errors='ignore')
          token=re.search(r'name="pageToken"[^>]*value="([^"]+)"',text); key=re.search(r'vmFileKey\s*:\s*"([^"]+)"',text)
          print('PAGE_TOKEN='+token.group(1)); print('FILE_KEY='+key.group(1))
          PY
          source "$RUNNER_TEMP/kfind.env"
          curl --fail --location --retry 3 --silent --show-error -c "$JAR" -b "$JAR" -e "$POP" \
            --data-urlencode "pageToken=$PAGE_TOKEN" --data-urlencode 'dbGubun=02' --data-urlencode 'sosok=GARANG' --data-urlencode 'depart=AI/Data' --data-urlencode 'agencyType=01' --data-urlencode 'usePurpose=02' --data-urlencode 'remark=GARANG 앱 영양 데이터베이스 연동 및 품질 검증' \
            "$BASE/nutrient/export/down/cudAction.do" -o "$RUNNER_TEMP/register.html"
          KEY="$(printf '%s' "$FILE_KEY" | jq -sRr @uri)"
          curl --fail --location --retry 3 --silent --show-error -c "$JAR" -b "$JAR" -e "$POP" "$BASE/nutrient/multi/file/download.do?key=$KEY" -o "$RUNNER_TEMP/food.xlsx"

      - name: Extract workbook header and samples
        shell: bash
        run: |
          python - <<'PY'
          import json,os,zipfile,xml.etree.ElementTree as ET,re
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'food.xlsx'
          ns={'m':'http://schemas.openxmlformats.org/spreadsheetml/2006/main','r':'http://schemas.openxmlformats.org/officeDocument/2006/relationships'}
          def col_index(ref):
              letters=re.match(r'([A-Z]+)',ref).group(1); n=0
              for ch in letters:n=n*26+ord(ch)-64
              return n-1
          with zipfile.ZipFile(p) as z:
              shared=[]
              if 'xl/sharedStrings.xml' in z.namelist():
                  root=ET.fromstring(z.read('xl/sharedStrings.xml'))
                  for si in root.findall('m:si',ns): shared.append(''.join(t.text or '' for t in si.findall('.//m:t',ns)))
              sheet=ET.fromstring(z.read('xl/worksheets/sheet1.xml')); rows=[]
              for row in sheet.findall('.//m:sheetData/m:row',ns)[:8]:
                  vals={}
                  for c in row.findall('m:c',ns):
                      ref=c.attrib.get('r','A1'); idx=col_index(ref); typ=c.attrib.get('t'); v=c.find('m:v',ns); inline=c.find('m:is',ns)
                      if inline is not None: val=''.join(t.text or '' for t in inline.findall('.//m:t',ns))
                      elif v is None: val=''
                      elif typ=='s': val=shared[int(v.text)] if int(v.text)<len(shared) else ''
                      else: val=v.text or ''
                      vals[idx]=val
                  width=max(vals.keys(),default=-1)+1; rows.append([vals.get(i,'') for i in range(width)])
          report={'observedAt':'2026-09-24','source':'K-FIND 음식 DB','rows':rows}
          Path('04_data/knowledge/kfind-food-schema-v1.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(report,ensure_ascii=False,indent=2)[:30000])
          PY
      - name: Commit schema evidence
        shell: bash
        run: |
          git config user.name 'GARANG K-FIND Ingestion'
          git config user.email 'actions@users.noreply.github.com'
          git add 04_data/knowledge/kfind-food-schema-v1.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record K-FIND food workbook schema [skip kfind-probe]'
          git push origin "HEAD:${GITHUB_REF_NAME}"

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FitMind AI">
<title>FitMind AI</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
<header><div><b>FitMind AI</b><small>개인 운동·식단 코치</small></div><div class="headerBtns"><button id="installBtn" hidden>설치</button><button id="accountBtn" hidden onclick="openPage('profile')">내정보</button></div></header>

<main>
<section id="auth" class="page active">
<h1>시작하기</h1>
<div class="card">
<div id="authTabs" class="tabs">
<button data-tab="login" class="active" onclick="setAuthTab('login')">로그인</button>
<button data-tab="signup" onclick="setAuthTab('signup')">회원가입</button>
</div>
<form id="loginForm" class="authForm">
<input id="loginEmail" type="email" placeholder="이메일" required>
<input id="loginPw" type="password" placeholder="비밀번호" required>
<button>로그인</button>
</form>
<form id="signupForm" class="authForm" hidden>
<input id="signupEmail" type="email" placeholder="이메일" required>
<input id="signupPw" type="password" placeholder="비밀번호 (6자 이상)" required>
<button>회원가입</button>
</form>
<button id="googleBtn" class="google" type="button">Google로 계속하기</button>
<p id="authError" class="muted"></p>
</div>
</section>

<section id="profile" class="page">
<h2>내 정보</h2>
<form id="profileForm" class="card">
<input id="profName" placeholder="이름" required>
<div class="row"><select id="profGender"><option value="">성별</option><option value="male">남성</option><option value="female">여성</option><option value="other">기타</option></select><input id="profAge" type="number" min="1" placeholder="나이"><input id="profHeight" type="number" step=".1" placeholder="키 cm"></div>
<input id="profGoal" placeholder="목표 (예: 체지방 감량, 근력 증가)">
<button>정보 저장</button>
</form>
<button class="button" type="button" onclick="logout()">로그아웃</button>
</section>

<section id="dashboard" class="page">
  <h1>오늘의 코칭</h1>
  <div class="hero"><div><span>AI 상태</span><strong id="aiStatus">로컬 코치</strong></div><button onclick="openPage('chat')">AI에게 질문</button></div>
  <div class="grid">
    <div class="card"><span>체중</span><b id="dashWeight">-</b><small>kg</small></div>
    <div class="card"><span>운동</span><b id="dashWorkout">0</b><small>회</small></div>
    <div class="card"><span>식단</span><b id="dashMeals">0</b><small>기록</small></div>
    <div class="card"><span>연속 기록</span><b id="dashStreak">0</b><small>일</small></div>
  </div>
  <div class="card"><h3>오늘의 AI 제안</h3><p id="coachTip">데이터를 입력하면 개인화된 제안을 만들어드려요.</p></div>
</section>

<section id="workout" class="page">
<h2>운동 기록</h2>
<form id="workoutForm" class="card">
<input id="exercise" placeholder="운동명 (예: 스쿼트)" required>
<div class="row"><input id="sets" type="number" min="1" placeholder="세트" required><input id="reps" type="number" min="1" placeholder="반복" required><input id="weight" type="number" min="0" step=".5" placeholder="kg"></div>
<textarea id="workoutNote" placeholder="난이도/컨디션/메모"></textarea><button>운동 저장</button>
</form>
<div id="workoutList"></div>
</section>

<section id="diet" class="page">
<h2>식단</h2>
<form id="mealForm" class="card">
<input id="meal" placeholder="음식/식사명" required>
<div class="row"><input id="calories" type="number" min="0" placeholder="kcal"><input id="protein" type="number" min="0" placeholder="단백질 g"></div>
<textarea id="mealNote" placeholder="양, 포만감, 컨디션"></textarea><button>식단 저장</button>
</form><div id="mealList"></div>
</section>

<section id="body" class="page">
<h2>바디체크</h2>
<form id="bodyForm" class="card">
<div class="row"><input id="bodyWeight" type="number" step=".1" placeholder="체중 kg"><input id="bodyWaist" type="number" step=".1" placeholder="허리 cm"></div>
<input id="bodyPhoto" type="file" accept="image/*"><textarea id="bodyNote" placeholder="사진/몸 상태 메모"></textarea>
<button>바디체크 저장</button>
</form><div id="bodyList"></div>
</section>

<section id="report" class="page">
<h2>리포트</h2>
<div class="tabs" id="reportTabs">
<button data-period="week" onclick="setReportPeriod('week')">주간</button>
<button data-period="month" onclick="setReportPeriod('month')">월간</button>
<button data-period="year" onclick="setReportPeriod('year')">연간</button>
<button data-period="all" onclick="setReportPeriod('all')">전체</button>
</div>
<div id="reportContent"></div>
<button onclick="exportBackup()">백업 파일 만들기</button>
<label class="button">백업 복원<input id="restoreFile" type="file" accept=".json" hidden></label>
</section>

<section id="chat" class="page">
<h2>AI 채팅</h2>
<div id="chatLog" class="chatlog"></div>
<form id="chatForm" class="chatbar"><input id="chatInput" placeholder="운동/식단/내 기록에 대해 물어보세요" required><button>전송</button></form>
<div class="card"><h3>AI 서버 연결</h3><input id="apiUrl" placeholder="https://your-server.example.com/chat"><input id="apiKey" type="password" placeholder="API Key (선택)"><button onclick="saveApi()">연결 설정 저장</button><small>실서비스에서는 API Key를 브라우저에 직접 저장하지 말고 서버 측 인증을 권장합니다.</small></div>
</section>
</main>

<nav id="mainNav" class="hidden">
<button onclick="openPage('dashboard')">홈</button><button onclick="openPage('workout')">운동</button><button onclick="openPage('diet')">식단</button><button onclick="openPage('body')">바디</button><button onclick="openPage('report')">리포트</button><button onclick="openPage('chat')">AI</button>
</nav>
</div>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="app.js"></script>
</body>
</html>

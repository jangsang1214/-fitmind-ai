<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
<title id="title">GARANG bench press training visual</title>
<desc id="desc">Original GARANG close-up training visual focused on a barbell, hands, forearms and upper torso during bench press.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#17191c"/><stop offset=".5" stop-color="#090a0c"/><stop offset="1" stop-color="#020303"/></linearGradient>
  <radialGradient id="light" cx="50%" cy="18%" r="70%"><stop stop-color="#f5f1ea" stop-opacity=".28"/><stop offset=".24" stop-color="#b8b3aa" stop-opacity=".10"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
  <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#41464a"/><stop offset=".14" stop-color="#d8dadb"/><stop offset=".48" stop-color="#f4f5f5"/><stop offset=".82" stop-color="#8c9195"/><stop offset="1" stop-color="#272b2e"/></linearGradient>
  <linearGradient id="skinL" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#c0ada1"/><stop offset=".32" stop-color="#967f74"/><stop offset=".72" stop-color="#65514b"/><stop offset="1" stop-color="#342b2a"/></linearGradient>
  <linearGradient id="skinR" x1="1" y1="0" x2="0" y2="1"><stop stop-color="#c0ada1"/><stop offset=".32" stop-color="#967f74"/><stop offset=".72" stop-color="#65514b"/><stop offset="1" stop-color="#342b2a"/></linearGradient>
  <linearGradient id="shirt" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#2d3034"/><stop offset=".42" stop-color="#17191c"/><stop offset="1" stop-color="#070809"/></linearGradient>
  <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="13"/></filter>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity=".65"/></filter>
  <filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="17" result="n"/><feColorMatrix in="n" type="saturate" values="0"/><feComponentTransfer><feFuncA type="table" tableValues="0 .055"/></feComponentTransfer></filter>
</defs>
<rect width="1200" height="640" fill="url(#bg)"/>
<rect width="1200" height="640" fill="url(#light)"/>

<!-- soft gym context -->
<g opacity=".17" filter="url(#soft)">
  <rect x="58" y="32" width="25" height="510" rx="12" fill="#b7b9b9"/>
  <rect x="1112" y="28" width="30" height="520" rx="14" fill="#9b9e9f"/>
  <rect x="80" y="74" width="1040" height="12" rx="6" fill="#8d9091"/>
  <circle cx="180" cy="320" r="145" fill="#222529"/><circle cx="1020" cy="340" r="165" fill="#1b1e21"/>
</g>

<!-- upper torso fills frame; crop deliberately hides face and avoids mannequin/cartoon read -->
<g filter="url(#shadow)">
  <path d="M318 640 C329 520 379 422 475 357 C522 325 563 312 600 313 C638 312 680 325 727 357 C823 423 872 520 883 640 Z" fill="url(#shirt)"/>
  <path d="M389 540 C444 474 514 442 600 441 C686 442 756 474 811 540 C739 566 669 579 600 579 C531 579 461 566 389 540 Z" fill="#5f6365" opacity=".14"/>
  <path d="M454 490 C502 459 552 447 600 447 C648 447 699 459 747 490" fill="none" stroke="#a1a3a3" stroke-opacity=".11" stroke-width="7" stroke-linecap="round"/>

  <!-- left arm: continuous rounded form from shoulder to grip -->
  <path d="M420 455 C359 411 313 341 285 257 C274 224 283 195 306 178 C333 159 367 167 386 194 C424 248 452 309 497 365 C482 405 458 436 420 455 Z" fill="url(#skinL)"/>
  <path d="M285 257 C250 213 227 168 214 122 C205 89 225 60 257 54 C289 48 318 69 324 101 C335 158 358 205 389 244 C363 258 329 264 285 257 Z" fill="url(#skinL)"/>
  <path d="M245 84 C259 64 288 58 310 72 C331 86 337 115 324 137 C307 159 277 163 256 149 C235 135 230 107 245 84 Z" fill="url(#skinL)"/>
  <path d="M304 187 C326 205 342 225 355 249" fill="none" stroke="#ead1c4" stroke-opacity=".17" stroke-width="7" stroke-linecap="round"/>

  <!-- right arm -->
  <path d="M780 455 C841 411 887 341 915 257 C926 224 917 195 894 178 C867 159 833 167 814 194 C776 248 748 309 703 365 C718 405 742 436 780 455 Z" fill="url(#skinR)"/>
  <path d="M915 257 C950 213 973 168 986 122 C995 89 975 60 943 54 C911 48 882 69 876 101 C865 158 842 205 811 244 C837 258 871 264 915 257 Z" fill="url(#skinR)"/>
  <path d="M955 84 C941 64 912 58 890 72 C869 86 863 115 876 137 C893 159 923 163 944 149 C965 135 970 107 955 84 Z" fill="url(#skinR)"/>
  <path d="M896 187 C874 205 858 225 845 249" fill="none" stroke="#ead1c4" stroke-opacity=".17" stroke-width="7" stroke-linecap="round"/>
</g>

<!-- bar dominates focal plane -->
<rect x="72" y="111" width="1056" height="17" rx="8.5" fill="url(#steel)"/>
<rect x="292" y="98" width="60" height="43" rx="7" fill="#6c7174"/><rect x="848" y="98" width="60" height="43" rx="7" fill="#6c7174"/>

<!-- grip shadow and knuckle detail, hands wrap bar instead of floating -->
<path d="M248 101 C267 87 295 88 312 104 C326 118 326 136 316 150 C302 161 278 162 260 150 C241 137 237 116 248 101 Z" fill="url(#skinL)" opacity=".96"/>
<path d="M952 101 C933 87 905 88 888 104 C874 118 874 136 884 150 C898 161 922 162 940 150 C959 137 963 116 952 101 Z" fill="url(#skinR)" opacity=".96"/>
<path d="M260 112 L305 112 M895 112 L940 112" stroke="#ead5cb" stroke-opacity=".22" stroke-width="4" stroke-linecap="round"/>

<!-- cropped plates create photographic depth -->
<g transform="translate(72 120)"><ellipse rx="74" ry="155" fill="#111315" stroke="#5b6064" stroke-width="6"/><ellipse rx="49" ry="125" fill="#070809" stroke="#35393c" stroke-width="4"/><ellipse rx="12" ry="32" fill="#9da1a4"/></g>
<g transform="translate(1128 120)"><ellipse rx="78" ry="162" fill="#101214" stroke="#5b6064" stroke-width="6"/><ellipse rx="52" ry="130" fill="#070809" stroke="#35393c" stroke-width="4"/><ellipse rx="12" ry="32" fill="#9da1a4"/></g>
<g transform="translate(160 120)"><ellipse rx="44" ry="114" fill="#151719" stroke="#4a4f52" stroke-width="4"/></g>
<g transform="translate(1040 120)"><ellipse rx="44" ry="114" fill="#151719" stroke="#4a4f52" stroke-width="4"/></g>

<!-- GARANG accent stays on equipment, never on the body -->
<rect x="846" y="96" width="4" height="47" rx="2" fill="#ef263d"/>
<path d="M786 579 H1016" stroke="#ef263d" stroke-width="3" stroke-linecap="round" opacity=".7"/>

<!-- subtle texture and vignette -->
<rect width="1200" height="640" filter="url(#grain)" opacity=".42" pointer-events="none"/>
<rect y="526" width="1200" height="114" fill="#020303" opacity=".40"/>
<rect x="0" y="0" width="1200" height="640" fill="none" stroke="#000" stroke-opacity=".35" stroke-width="24"/>
</svg>
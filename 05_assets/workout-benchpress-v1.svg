<g transform="translate(1094 147)"><ellipse rx="70" ry="140" fill="url(#plate)" stroke="#606873" stroke-width="6"/><ellipse rx="47" ry="111" fill="#11151a" stroke="#737b86" stroke-width="4"/><ellipse rx="12" ry="31" fill="#9ca4ae"/></g>
<g transform="translate(1002 147)"><ellipse rx="50" ry="112" fill="url(#plate)" stroke="#59616c" stroke-width="5"/><ellipse rx="11" ry="27" fill="#949ca6"/></g>

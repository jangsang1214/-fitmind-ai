<path d="M542 369 C574 386 616 391 653 382 M681 365 C718 378 754 389 786 390" fill="none" stroke="#e2b199" stroke-width="5" opacity=".25" stroke-linecap="round"/>
<path d="M526 407 C547 422 574 431 602 431 M785 414 C762 428 738 434 714 434" fill="none" stroke="#e0ae95" stroke-width="4" opacity=".18" stroke-linecap="round"/>
<path d="M474 233 C465 203 456 169 450 132 M932 249 C945 215 954 181 960 144" fill="none" stroke="#f0c0a7" stroke-width="7" opacity=".22" stroke-linecap="round"/>
<path d="M629 342 C621 372 622 402 630 430 M694 344 C688 372 691 401 700 430" fill="none" stroke="#27191b" stroke-width="4" opacity=".55"/>
<circle cx="737" cy="234" r="205" fill="#7c82ff" opacity=".035" filter="url(#soft)"/>
<rect y="505" width="1200" height="135" fill="#05070a" opacity=".34"/>
</svg>
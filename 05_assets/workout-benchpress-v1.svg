<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
<title id="title">GARANG bench press training visual</title><desc id="desc">Original dark high-detail vector illustration of a muscular athlete performing a barbell bench press.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#222933"/><stop offset=".38" stop-color="#11161d"/><stop offset="1" stop-color="#06080b"/></linearGradient>
 <radialGradient id="light" cx="64%" cy="27%" r="62%"><stop stop-color="#a9b1c3" stop-opacity=".32"/><stop offset=".42" stop-color="#596170" stop-opacity=".1"/><stop offset="1" stop-color="#090c11" stop-opacity="0"/></radialGradient>
 <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d0a083"/><stop offset=".28" stop-color="#a97861"/><stop offset=".62" stop-color="#705043"/><stop offset="1" stop-color="#2c2525"/></linearGradient>
 <linearGradient id="skinDark" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#9d715e"/><stop offset=".5" stop-color="#63453c"/><stop offset="1" stop-color="#282124"/></linearGradient>
 <linearGradient id="muscleWarm" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d39479"/><stop offset=".42" stop-color="#8f5a4b"/><stop offset="1" stop-color="#4a3130"/></linearGradient>
 <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#252a31"/><stop offset=".13" stop-color="#d3d7dc"/><stop offset=".5" stop-color="#f7f8f9"/><stop offset=".82" stop-color="#89919b"/><stop offset="1" stop-color="#20252b"/></linearGradient>
 <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#3a414b"/><stop offset=".46" stop-color="#181d24"/><stop offset="1" stop-color="#07090c"/></linearGradient>
 <linearGradient id="bench" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#303640"/><stop offset=".5" stop-color="#151a20"/><stop offset="1" stop-color="#090b0e"/></linearGradient>
 <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="22"/></filter>
 <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="10"/></filter>
 <filter id="depth" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#000" flood-opacity=".6"/></filter>
</defs>
<rect width="1200" height="640" fill="url(#bg)"/><rect width="1200" height="640" fill="url(#light)"/>
<!-- distant gym rack -->
<g opacity=".2"><rect x="86" y="18" width="25" height="470" rx="9" fill="#717985"/><rect x="1070" y="15" width="28" height="490" rx="9" fill="#747c87"/><rect x="93" y="55" width="995" height="15" rx="7" fill="#656d77"/><circle cx="102" cy="122" r="7" fill="#d2d5d9"/><circle cx="1083" cy="120" r="7" fill="#d2d5d9"/></g>
<ellipse cx="618" cy="566" rx="460" ry="57" fill="#000" opacity=".54" filter="url(#shadow)"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
<title id="title">GARANG bench press training visual</title>
<desc id="desc">Original GARANG cinematic training illustration of an athlete performing a barbell bench press in a restrained premium gym environment.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#181a1d"/><stop offset=".48" stop-color="#0b0c0e"/><stop offset="1" stop-color="#030405"/>
  </linearGradient>
  <radialGradient id="key" cx="58%" cy="30%" r="62%">
    <stop offset="0" stop-color="#f0ede7" stop-opacity=".26"/><stop offset=".34" stop-color="#a9a59d" stop-opacity=".09"/><stop offset="1" stop-color="#000" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
    <stop stop-color="#43474b"/><stop offset=".18" stop-color="#d7d8d8"/><stop offset=".5" stop-color="#fafafa"/><stop offset=".78" stop-color="#8e9295"/><stop offset="1" stop-color="#2b2f32"/>
  </linearGradient>
  <linearGradient id="cloth" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#33363a"/><stop offset=".36" stop-color="#17191c"/><stop offset="1" stop-color="#070809"/>
  </linearGradient>
  <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#b9a89d"/><stop offset=".34" stop-color="#8e7c72"/><stop offset=".72" stop-color="#594a45"/><stop offset="1" stop-color="#2c2726"/>
  </linearGradient>
  <linearGradient id="bench" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#34373b"/><stop offset=".55" stop-color="#17191b"/><stop offset="1" stop-color="#090a0b"/>
  </linearGradient>
  <filter id="blur24" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="24"/></filter>
  <filter id="blur10" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="10"/></filter>
  <filter id="subjectShadow" x="-25%" y="-25%" width="150%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity=".62"/></filter>
</defs>

<rect width="1200" height="640" fill="url(#bg)"/>
<rect width="1200" height="640" fill="url(#key)"/>

<!-- cinematic gym depth: soft equipment silhouettes, no fake photographic crop -->
<g opacity=".19" filter="url(#blur10)">
  <rect x="52" y="55" width="34" height="438" rx="10" fill="#b8bab9"/>
  <rect x="1115" y="42" width="38" height="458" rx="10" fill="#a8aaa9"/>
  <rect x="78" y="91" width="1060" height="15" rx="8" fill="#777a7c"/>
  <circle cx="164" cy="235" r="88" fill="#24272a"/>
  <circle cx="1012" cy="263" r="118" fill="#1e2124"/>
</g>
<ellipse cx="633" cy="568" rx="455" ry="63" fill="#000" opacity=".58" filter="url(#blur24)"/>

<!-- bench and rack -->
<g>
  <path d="M301 487 C348 474 810 474 870 489 L935 538 H240 Z" fill="url(#bench)" stroke="#4c4e50" stroke-opacity=".55" stroke-width="3"/>
  <path d="M330 530 L279 625 H235 L288 530 Z M840 530 L895 625 H939 L887 530 Z" fill="#0b0c0d"/>
  <path d="M356 461 H833 C854 461 872 476 872 494 H317 C317 476 334 461 356 461 Z" fill="#222427" stroke="#505255" stroke-opacity=".44" stroke-width="2"/>
</g>

<!-- athlete: clothed, continuous silhouette, deliberately not anatomical armor -->
<g filter="url(#subjectShadow)">
  <!-- head / neck -->
  <path d="M409 365 C398 343 401 315 419 294 C438 273 471 269 493 287 C515 306 518 339 502 362 C486 386 431 391 409 365 Z" fill="url(#skin)"/>
  <path d="M419 304 C439 281 472 281 493 296 C476 289 451 295 430 310 Z" fill="#101113"/>
  <path d="M474 361 C491 356 513 363 529 380 L511 411 L474 400 Z" fill="url(#skin)"/>

  <!-- torso in compression shirt -->
  <path d="M507 362 C551 326 613 313 683 320 C760 327 826 359 874 414 C857 458 811 493 745 510 L526 505 C490 484 471 449 474 416 C478 392 490 375 507 362 Z" fill="url(#cloth)"/>
  <!-- soft fabric highlights creating volume -->
  <path d="M531 369 C575 348 622 345 666 355 C694 367 709 386 710 407 C645 424 581 419 525 392 Z" fill="#5c5f62" opacity=".24"/>
  <path d="M708 353 C760 355 806 378 839 414 C815 430 783 440 746 444 C724 418 712 387 708 353 Z" fill="#64676a" opacity=".15"/>
  <path d="M541 442 C610 462 704 468 790 444" fill="none" stroke="#9b9d9e" stroke-opacity=".11" stroke-width="7" stroke-linecap="round"/>

  <!-- left arm, one continuous mass -->
  <path d="M528 383 C501 350 476 311 457 269 C447 247 452 223 471 210 C490 197 516 202 530 222 C551 254 566 297 596 340 C575 356 553 371 528 383 Z" fill="url(#skin)"/>
  <path d="M457 269 C438 234 422 190 414 146 C408 116 425 92 451 88 C478 84 501 104 505 132 C511 178 522 216 540 249 C520 260 493 267 457 269 Z" fill="url(#skin)"/>

  <!-- right arm -->
  <path d="M790 388 C824 351 852 309 876 265 C889 242 917 234 938 247 C960 260 966 287 952 311 C925 356 894 396 851 434 C830 419 810 404 790 388 Z" fill="url(#skin)"/>
  <path d="M876 265 C895 226 908 188 915 145 C920 116 944 98 970 102 C997 106 1014 131 1009 159 C1000 206 985 247 962 288 C935 283 907 276 876 265 Z" fill="url(#skin)"/>

  <!-- hands -->
  <path d="M394 111 C403 89 428 78 449 87 C471 96 482 121 472 143 C461 166 436 174 414 164 C393 154 385 132 394 111 Z" fill="url(#skin)"/>
  <path d="M928 112 C938 89 962 78 984 87 C1006 96 1017 121 1007 144 C997 167 971 175 949 165 C928 155 919 133 928 112 Z" fill="url(#skin)"/>
</g>

<!-- barbell: crisp highlight against subdued subject -->
<rect x="92" y="137" width="1010" height="16" rx="8" fill="url(#metal)"/>
<rect x="271" y="126" width="55" height="38" rx="7" fill="#65696d"/>
<rect x="879" y="126" width="55" height="38" rx="7" fill="#65696d"/>

<!-- plates -->
<g transform="translate(103 145)">
  <ellipse rx="67" ry="132" fill="#111315" stroke="#565a5e" stroke-width="5"/>
  <ellipse rx="46" ry="106" fill="#08090a" stroke="#34373a" stroke-width="3"/>
  <ellipse rx="12" ry="30" fill="#9a9da0"/>
</g>
<g transform="translate(196 145)">
  <ellipse rx="44" ry="104" fill="#141618" stroke="#4a4e51" stroke-width="4"/><ellipse rx="10" ry="26" fill="#8d9093"/>
</g>
<g transform="translate(1096 145)">
  <ellipse rx="74" ry="144" fill="#101214" stroke="#5c6064" stroke-width="6"/>
  <ellipse rx="50" ry="116" fill="#070809" stroke="#373a3d" stroke-width="4"/>
  <ellipse rx="13" ry="32" fill="#a1a4a7"/>
</g>
<g transform="translate(1000 145)">
  <ellipse rx="48" ry="112" fill="#141618" stroke="#505458" stroke-width="5"/><ellipse rx="11" ry="28" fill="#919497"/>
</g>

<!-- restrained GARANG accent: equipment mark, not body paint -->
<rect x="878" y="124" width="4" height="42" rx="2" fill="#ef263d"/>
<path d="M902 520 H1025" stroke="#ef263d" stroke-width="3" stroke-linecap="round" opacity=".72"/>

<!-- foreground falloff -->
<rect y="528" width="1200" height="112" fill="#020303" opacity=".36"/>
</svg>
<g transform="translate(112 147)"><ellipse rx="60" ry="122" fill="url(#plate)" stroke="#59616c" stroke-width="5"/><ellipse rx="39" ry="96" fill="#11151a" stroke="#69717c" stroke-width="3"/><ellipse rx="11" ry="28" fill="#9aa2ac"/></g>
<g transform="translate(197 147)"><ellipse rx="45" ry="103" fill="url(#plate)" stroke="#535b66" stroke-width="4"/><ellipse rx="10" ry="25" fill="#929aa4"/></g>
